# 服务器端口
server:
  port: 8080
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

# Spring 配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # MySQL 连接配置
    url: jdbc:mysql://localhost:3306/medicine?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root  # 你的 MySQL 用户名
    password: 123456  # 你的 MySQL密码
  
  # Redis 配置
  data:
    redis:
      host: 172.29.150.141
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
        shutdown-timeout: 100ms
  
  # Jackson JSON 序列化配置
  jackson:
    default-property-inclusion: non_null  # 忽略空值字段
    serialization:
      write-dates-as-timestamps: false  # 日期不以时间戳形式返回

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml  # XML 映射文件位置
  type-aliases-package: com.example.spring_boot.entity  # 实体类别名包
  configuration:
    map-underscore-to-camel-case: true  # 数据库下划线转实体类驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL 日志