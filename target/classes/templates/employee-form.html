<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.container{max-width:800px}</style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/index">药店管理系统</a></div></nav>
  <div class="container mt-4">
    <h3 id="title">员工 - 新建</h3>
    <form id="form" class="card p-3">
      <div class="mb-3"><label class="form-label">员工ID</label><input id="employee_id" class="form-control"></div>
      <div class="mb-3"><label class="form-label">姓名</label><input id="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">岗位</label><input id="post" class="form-control"></div>
      <div class="d-flex gap-2"><button class="btn btn-primary">保存</button><a class="btn btn-secondary" href="/employee">返回</a></div>
    </form>
  </div>
  <script>
    function qs(name){const u=new URLSearchParams(location.search);return u.get(name);} 
    const id = qs('id');
    if(id){ document.getElementById('title').textContent='员工 - 编辑'; fetch(`/employee/${id}`).then(r=>r.json()).then(e=>{ e=e||{}; document.getElementById('employee_id').value=e.employee_id||''; document.getElementById('name').value=e.name||''; document.getElementById('post').value=e.post||'';}).catch(err=>console.error(err)); }

    document.getElementById('form').addEventListener('submit', function(e){
      e.preventDefault();
      const payload = {
        employee_id: document.getElementById('employee_id').value,
        name: document.getElementById('name').value,
        post: document.getElementById('post').value
      };
      const url = id ? `/employee/${id}` : '/employee';
      const method = id ? 'PUT' : 'POST';
      fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
        .then(r=>{ if(r.ok) location.href='/employee'; else alert('保存失败'); })
        .catch(err=>{ console.error(err); alert('保存失败'); });
    });
  </script>
</body>
</html>
