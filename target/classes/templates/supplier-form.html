<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应商表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.container{max-width:800px}</style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/index">药店管理系统</a></div></nav>
  <div class="container mt-4">
    <h3 id="title">供应商 - 新建</h3>
    <form id="form" class="card p-3">
      <div class="mb-3"><label class="form-label">供应商ID</label><input id="supplier_id" class="form-control"></div>
      <div class="mb-3"><label class="form-label">名称</label><input id="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">联系电话</label><input id="contact_phone" class="form-control"></div>
      <div class="mb-3"><label class="form-label">状态</label>
        <select id="status" class="form-select">
          <option value="1">启用</option>
          <option value="0">停用</option>
        </select>
      </div>
      <div class="d-flex gap-2"><button id="saveBtn" class="btn btn-primary">保存</button><a class="btn btn-secondary" href="/supplier">返回</a></div>
    </form>
  </div>
  <script>
    function qs(name){const u=new URLSearchParams(location.search);return u.get(name);} 
    const id = qs('id');
    const title = document.getElementById('title');
    const saveBtn = document.getElementById('saveBtn');

    if(id){
      title.textContent = '供应商 - 编辑';
      fetch(`/supplier/${id}`).then(r=>r.json()).then(data=>{
        const s = data || {};
        document.getElementById('supplier_id').value = s.supplier_id || s.id || '';
        document.getElementById('name').value = s.name || '';
        document.getElementById('contact_phone').value = s.contact_phone || '';
        document.getElementById('status').value = (s.status==null? '1' : String(s.status));
      }).catch(e=>console.error(e));
    }

    document.getElementById('form').addEventListener('submit', function(e){
      e.preventDefault();
      const payload = {
        supplier_id: document.getElementById('supplier_id').value,
        name: document.getElementById('name').value,
        contact_phone: document.getElementById('contact_phone').value,
        status: parseInt(document.getElementById('status').value, 10)
      };
      const url = id ? `/supplier/${id}` : '/supplier';
      const method = id ? 'PUT' : 'POST';

      fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
        .then(r=>{ if(r.ok){ location.href = '/supplier'; } else { alert('保存失败'); } })
        .catch(e=>{ console.error(e); alert('保存失败'); });
    });
  </script>
</body>
</html>
