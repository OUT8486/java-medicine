<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 药店管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #666;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .btn-login {
            background: #4f46e5;
            border: none;
            padding: 0.75rem;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.3s;
        }
        .btn-login:hover {
            background: #4338ca;
        }
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .register-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .alert-danger {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>药店管理系统</h2>
            <p>请登录您的账户</p>
        </div>
        
        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
        
        <form id="loginForm" method="post" action="/login">
            <div class="form-group">
                <label for="user_name" class="form-label">用户名</label>
                <input type="text" class="form-control" id="user_name" name="user_name" required placeholder="请输入用户名">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">登录</button>
        </form>
        
        <div class="register-link">
            <p>还没有账户？ <a href="/register">立即注册</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('user_name').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            // 基本验证
            if (!username || !password) {
                errorMessage.textContent = '请输入用户名和密码';
                errorMessage.style.display = 'block';
                return;
            }
            
            // 创建表单数据
            const formData = new FormData();
            formData.append('user_name', username);
            formData.append('password', password);
            
            // 发送登录请求
            fetch('/login', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 登录成功，显示成功消息并跳转
                    errorMessage.textContent = '登录成功！正在跳转...';
                    errorMessage.className = 'alert alert-success';
                    errorMessage.style.display = 'block';
                    
                    // 延迟跳转到首页
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    // 登录失败，显示错误信息
                    errorMessage.textContent = data.message || '用户名或密码错误';
                    errorMessage.className = 'alert alert-danger';
                    errorMessage.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('登录错误:', error);
                errorMessage.textContent = '登录失败，请稍后重试';
                errorMessage.className = 'alert alert-danger';
                errorMessage.style.display = 'block';
            });
        });
        
        // 输入时隐藏错误信息
        document.getElementById('user_name').addEventListener('input', function() {
            document.getElementById('error-message').style.display = 'none';
        });
        
        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('error-message').style.display = 'none';
        });
    </script>
</body>
</html>
