<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工管理 - 药店管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .action-buttons .btn { margin: 0 2px; }
        .table th { white-space: nowrap; }
    </style>
</head>
<body>
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-people me-2"></i>员工管理</h2>
    <button type="button" class="btn btn-primary" onclick="addEmployee()">
      <i class="bi bi-plus-circle"></i> 新增员工
    </button>
  </div>

  <!-- 搜索区域 -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <input type="text" class="form-control" id="q_name" placeholder="员工姓名">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="q_post">
            <option value="">全部岗位</option>
            <option value="采购">采购</option>
            <option value="销售">销售</option>
            <option value="库管">库管</option>
            <option value="审核">审核</option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="button" class="btn btn-outline-primary" onclick="searchEmployees()">
            <i class="bi bi-search"></i> 搜索
          </button>
          <button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">
            <i class="bi bi-x-circle"></i> 重置
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 员工列表 -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>员工ID</th>
              <th>姓名</th>
              <th>岗位</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            <tr>
              <td colspan="4" class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">加载中...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- 分页 -->
      <nav aria-label="员工列表分页">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
      </nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/employee';
let currentEmployees = [];
let currentPage = 1;
const pageSize = 10;

// 加载员工列表
async function loadEmployees(page = 1, searchParams = {}) {
  try {
    showLoading();
    
    let url = `${apiBase}/list`;
    const response = await fetch(url);
    const data = await response.json();
    
    // 处理不同的响应格式
    let employees = [];
    if (Array.isArray(data)) {
      employees = data;
    } else if (data && data.employees) {
      employees = data.employees;
    } else if (data && Array.isArray(data.list)) {
      employees = data.list;
    }
    
    currentEmployees = employees;
    currentPage = page;
    
    // 应用搜索过滤
    const filteredEmployees = filterEmployees(employees, searchParams);
    
    // 显示数据
    displayEmployees(filteredEmployees);
    
  } catch (error) {
    console.error('加载员工列表失败:', error);
    showError('加载员工列表失败，请刷新重试');
  }
}

// 过滤员工数据
function filterEmployees(employees, searchParams) {
  return employees.filter(employee => {
    const nameMatch = !searchParams.name || 
      (employee.name && employee.name.toLowerCase().includes(searchParams.name.toLowerCase()));
    const postMatch = !searchParams.post || employee.post === searchParams.post;
    
    return nameMatch && postMatch;
  });
}

// 显示员工列表
function displayEmployees(employees) {
  const tbody = document.getElementById('employeeTableBody');
  
  if (!employees || employees.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">暂无员工数据</td></tr>';
    return;
  }
  
  const startIndex = (currentPage - 1) * pageSize;
  const endIndex = Math.min(startIndex + pageSize, employees.length);
  const pageEmployees = employees.slice(startIndex, endIndex);
  
  tbody.innerHTML = pageEmployees.map(employee => `
    <tr>
      <td><strong>${employee.employee_id || '-'}</strong></td>
      <td>${employee.name || '-'}</td>
      <td>${employee.post || '-'}</td>
      <td class="action-buttons">
        <button class="btn btn-sm btn-outline-primary" onclick="viewEmployee('${employee.employee_id}')">
          <i class="bi bi-eye"></i> 查看
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="editEmployee('${employee.employee_id}')">
          <i class="bi bi-pencil"></i> 编辑
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee('${employee.employee_id}')">
          <i class="bi bi-trash"></i> 删除
        </button>
      </td>
    </tr>
  `).join('');
  
  // 更新分页
  updatePagination(employees.length);
}

// 更新分页控件
function updatePagination(totalCount) {
  const totalPages = Math.ceil(totalCount / pageSize);
  const pagination = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  
  let paginationHtml = '';
  
  // 上一页
  if (currentPage > 1) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a>
      </li>
    `;
  }
  
  // 页码
  for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
    paginationHtml += `
      <li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
      </li>
    `;
  }
  
  // 下一页
  if (currentPage < totalPages) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a>
      </li>
    `;
  }
  
  pagination.innerHTML = paginationHtml;
}

// 分页切换
function changePage(page) {
  currentPage = page;
  const searchParams = getSearchParams();
  displayEmployees(filterEmployees(currentEmployees, searchParams));
}

// 获取搜索参数
function getSearchParams() {
  return {
    name: document.getElementById('q_name').value.trim(),
    post: document.getElementById('q_post').value
  };
}

// 搜索功能
function searchEmployees() {
  const searchParams = getSearchParams();
  const filteredEmployees = filterEmployees(currentEmployees, searchParams);
  currentPage = 1;
  displayEmployees(filteredEmployees);
}

// 清空搜索
function clearSearch() {
  document.getElementById('q_name').value = '';
  document.getElementById('q_post').value = '';
  currentPage = 1;
  displayEmployees(currentEmployees);
}

// 刷新数据
function refreshData() {
  loadEmployees();
}

// 显示加载状态
function showLoading() {
  document.getElementById('employeeTableBody').innerHTML = `
    <tr>
      <td colspan="4" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">加载中...</span>
        </div>
      </td>
    </tr>
  `;
}

// 显示错误信息
function showError(message) {
  document.getElementById('employeeTableBody').innerHTML = `
    <tr>
      <td colspan="4" class="text-center text-danger">
        <i class="bi bi-exclamation-triangle"></i> ${message}
      </td>
    </tr>
  `;
}

// 查看员工详情
function viewEmployee(id) {
  window.location.href = `/employee/form?id=${id}`;
}

// 编辑员工
function editEmployee(id) {
  window.location.href = `/employee/form?id=${id}`;
}

// 删除员工
async function deleteEmployee(id) {
  if (!confirm('确定要删除这个员工吗？')) {
    return;
  }
  
  try {
    const response = await fetch(`${apiBase}/${id}`, {
      method: 'DELETE'
    });
    
    if (response.ok) {
      alert('删除成功');
      loadEmployees();
    } else {
      const error = await response.json();
      alert('删除失败: ' + (error.message || '未知错误'));
    }
  } catch (error) {
    console.error('删除员工失败:', error);
    alert('删除失败，请稍后重试');
  }
}

// 新增员工
function addEmployee() {
  window.location.href = '/employee/form';
}

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
  loadEmployees();
});
</script>
</body>
</html>
