<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购订单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .search-row .col {padding-right:8px;}
    .purchase-card { border-left: 4px solid #6610f2; }
    .stats-card { background: linear-gradient(135deg, #6610f2 0%, #520dc2 100%); color: white; }
    .action-buttons .btn { margin: 0 2px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/index"><i class="bi bi-house"></i> 返回首页</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <!-- 页面标题和统计 -->
  <div class="row mb-4">
    <div class="col-md-8">
      <h2><i class="bi bi-cart-check"></i> 采购订单</h2>
      <p class="text-muted">管理药品采购订单，跟踪采购进度和审核状态</p>
    </div>
    <div class="col-md-4">
      <div class="card stats-card h-100">
        <div class="card-body text-center">
          <h5>订单总数</h5>
          <h2 id="totalOrders">0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-plus-circle"></i> 新增订单
      </button>
      <button class="btn btn-outline-secondary" onclick="refreshData()">
        <i class="bi bi-arrow-clockwise"></i> 刷新
      </button>
    </div>
    <div class="d-flex gap-2">
      <select id="statusFilter" class="form-select" style="width: auto;" onchange="filterByStatus()">
        <option value="">全部状态</option>
        <option value="0">未审核</option>
        <option value="1">已审核</option>
      </select>
    </div>
  </div>

  <!-- 搜索区域 -->
  <div class="card p-3 mb-4">
    <div class="row search-row g-2">
      <div class="col-md-3">
        <input id="q_supplier_id" class="form-control" placeholder="供应商编号">
      </div>
      <div class="col-md-3">
        <input id="q_po_date" class="form-control" placeholder="采购日期" type="date">
      </div>
      <div class="col-md-3">
        <select id="q_audit_status" class="form-select">
          <option value="">审核状态</option>
          <option value="0">未审核</option>
          <option value="1">已审核</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" onclick="searchOrders()">
          <i class="bi bi-search"></i> 搜索
        </button>
        <button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">
          <i class="bi bi-x-circle"></i> 重置
        </button>
      </div>
    </div>
  </div>

  <!-- 订单列表 -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>订单编号</th>
              <th>供应商编号</th>
              <th>采购日期</th>
              <th>经办人编号</th>
              <th>审核状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <tr>
              <td colspan="6" class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">加载中...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- 分页 -->
      <nav aria-label="订单列表分页">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
      </nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/purchase-order';
let currentOrders = [];
let currentPage = 1;
const pageSize = 10;

// 加载订单列表
async function loadOrders(page = 1, searchParams = {}) {
  try {
    showLoading();
    
    // 构造API URL
    let url = `${apiBase}/list`;
    
    // 发送请求
    const response = await fetch(url);
    
    // 检查响应状态
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    // 解析JSON数据
    const rawData = await response.json();
    
    // 处理不同的数据格式
    let orders = [];
    if (Array.isArray(rawData)) {
      // 直接是数组格式
      orders = rawData;
    } else if (rawData && rawData.orders && Array.isArray(rawData.orders)) {
      // 包含orders字段的对象格式
      orders = rawData.orders;
    } else if (rawData && rawData.list && Array.isArray(rawData.list)) {
      // 包含list字段的对象格式
      orders = rawData.list;
    } else {
      // 其他格式，尝试直接使用
      orders = rawData;
    }
    
    // 确保orders是数组
    if (!Array.isArray(orders)) {
      orders = [];
    }
    
    // 保存当前数据
    currentOrders = orders;
    currentPage = page;
    
    // 应用搜索过滤
    const filteredOrders = filterOrders(orders, searchParams);
    
    // 更新统计数据
    const totalElement = document.getElementById('totalOrders');
    if (totalElement) {
      totalElement.textContent = orders.length;
    }
    
    // 显示数据
    displayOrders(filteredOrders);
    
  } catch (error) {
    console.error('加载订单列表失败:', error);
    showError('加载订单列表失败，请刷新重试: ' + error.message);
  }
}

// 过滤订单数据
function filterOrders(orders, searchParams) {
  if (!orders || !Array.isArray(orders)) {
    return [];
  }
  
  return orders.filter(order => {
    // 供应商ID过滤
    const supplierIdMatch = !searchParams.supplierId || 
      (order.supplier_id && order.supplier_id.toLowerCase().includes(searchParams.supplierId.toLowerCase()));
    
    // 采购日期过滤
    const dateMatch = !searchParams.poDate || 
      (order.po_date && order.po_date.includes(searchParams.poDate));
    
    // 审核状态过滤
    const statusMatch = searchParams.auditStatus === '' || searchParams.auditStatus === undefined ||
      order.audit_status == searchParams.auditStatus;
    
    return supplierIdMatch && dateMatch && statusMatch;
  });
}

// 显示订单列表
function displayOrders(orders) {
  const tbody = document.getElementById('orderTableBody');
  
  if (!tbody) {
    console.error('找不到订单表格主体元素');
    return;
  }
  
  // 检查是否有数据
  if (!orders || !Array.isArray(orders) || orders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无订单数据</td></tr>';
    return;
  }
  
  // 计算分页
  const startIndex = (currentPage - 1) * pageSize;
  const endIndex = Math.min(startIndex + pageSize, orders.length);
  const pageOrders = orders.slice(startIndex, endIndex);
  
  // 生成表格行HTML
  const rowsHtml = pageOrders.map(order => {
    // 确保所有字段都有默认值
    const poId = order.po_id || '-';
    const supplierId = order.supplier_id || '-';
    const poDate = order.po_date || '-';
    const employeeId = order.employee_id || '-';
    const auditStatus = order.audit_status !== undefined ? order.audit_status : 0;
    
    // 根据审核状态设置样式
    const statusBadge = auditStatus == 1 ? 
      '<span class="badge bg-success">已审核</span>' : 
      '<span class="badge bg-warning">未审核</span>';
    
    return `
      <tr class="purchase-card">
        <td><strong>${poId}</strong></td>
        <td>${supplierId}</td>
        <td>${poDate}</td>
        <td>${employeeId}</td>
        <td>${statusBadge}</td>
        <td class="action-buttons">
          <button class="btn btn-sm btn-outline-primary" onclick="viewOrder('${poId}')">
            <i class="bi bi-eye"></i> 查看
          </button>
          <button class="btn btn-sm btn-outline-secondary" onclick="editOrder('${poId}')">
            <i class="bi bi-pencil"></i> 编辑
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteOrder('${poId}')">
            <i class="bi bi-trash"></i> 删除
          </button>
        </td>
      </tr>
    `;
  }).join('');
  
  // 更新表格内容
  tbody.innerHTML = rowsHtml;
  
  // 更新分页控件
  updatePagination(orders.length);
}

// 更新分页控件
function updatePagination(totalCount) {
  const totalPages = Math.ceil(totalCount / pageSize);
  const pagination = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  
  let paginationHtml = '';
  
  // 上一页
  if (currentPage > 1) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a>
      </li>
    `;
  }
  
  // 页码
  for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
    paginationHtml += `
      <li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
      </li>
    `;
  }
  
  // 下一页
  if (currentPage < totalPages) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a>
      </li>
    `;
  }
  
  pagination.innerHTML = paginationHtml;
}

// 分页切换
function changePage(page) {
  currentPage = page;
  const searchParams = getSearchParams();
  displayOrders(filterOrders(currentOrders, searchParams));
}

// 获取搜索参数
function getSearchParams() {
  return {
    supplierId: document.getElementById('q_supplier_id').value.trim(),
    poDate: document.getElementById('q_po_date').value,
    auditStatus: document.getElementById('q_audit_status').value
  };
}

// 搜索功能
function searchOrders() {
  const searchParams = getSearchParams();
  const filteredOrders = filterOrders(currentOrders, searchParams);
  currentPage = 1;
  displayOrders(filteredOrders);
}

// 状态筛选
function filterByStatus() {
  const status = document.getElementById('statusFilter').value;
  document.getElementById('q_audit_status').value = status;
  searchOrders();
}

// 清空搜索
function clearSearch() {
  document.getElementById('q_supplier_id').value = '';
  document.getElementById('q_po_date').value = '';
  document.getElementById('q_audit_status').value = '';
  document.getElementById('statusFilter').value = '';
  currentPage = 1;
  displayOrders(currentOrders);
}

// 刷新数据
function refreshData() {
  loadOrders();
}

// 显示加载状态
function showLoading() {
  document.getElementById('orderTableBody').innerHTML = `
    <tr>
      <td colspan="6" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">加载中...</span>
        </div>
      </td>
    </tr>
  `;
}

// 显示错误信息
function showError(message) {
  document.getElementById('orderTableBody').innerHTML = `
    <tr>
      <td colspan="6" class="text-center text-danger">
        <i class="bi bi-exclamation-triangle"></i> ${message}
      </td>
    </tr>
  `;
}

// 查看订单详情
function viewOrder(id) {
  window.location.href = `/purchase-order/form?id=${id}`;
}

// 编辑订单
function editOrder(id) {
  window.location.href = `/purchase-order/form?id=${id}`;
}

// 查看订单明细
function viewOrderItems(id) {
  window.location.href = `/purchase-order-item?po_id=${id}`;
}

// 新增订单
function openAddModal() {
  window.location.href = '/purchase-order/form';
}

// 删除订单
async function deleteOrder(id) {
  if (!confirm('确定要删除这个采购订单吗？此操作不可恢复！')) {
    return;
  }
  
  try {
    const response = await fetch(`${apiBase}/${id}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      }
    });
    
    if (response.ok) {
      alert('采购订单删除成功！');
      loadOrders();
    } else {
      const result = await response.json();
      alert(`删除失败：${result.message || '未知错误'}`);
    }
  } catch (error) {
    console.error('删除采购订单失败:', error);
    alert('删除失败，请稍后重试');
  }
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
  // 确保必要的元素存在
  const tbody = document.getElementById('orderTableBody');
  if (!tbody) {
    console.error('页面结构不完整，缺少orderTableBody元素');
    return;
  }
  
  // 初始化加载数据
  loadOrders();
  
  // 绑定搜索事件
  const supplierInput = document.getElementById('q_supplier_id');
  const dateInput = document.getElementById('q_po_date');
  
  if (supplierInput) {
    supplierInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') searchOrders();
    });
  }
  
  if (dateInput) {
    dateInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') searchOrders();
    });
  }
});
</script>
</body>
</html>
