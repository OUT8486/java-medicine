<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购订单信息</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .form-container { max-width: 800px; margin: 2rem auto; }
    .section-title { border-bottom: 2px solid #198754; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    .readonly-field { background-color: #f8f9fa; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/purchase-order"><i class="bi bi-cart-check"></i> 采购订单</a>
      <a class="nav-link" href="/index"><i class="bi bi-house"></i> 返回首页</a>
    </div>
  </div>
</nav>

<div class="container form-container">
  <div class="card shadow">
    <div class="card-header bg-success text-white">
      <h4 class="mb-0">
        <i class="bi bi-cart-check"></i> 
        <span id="formTitle">新增采购订单</span>
      </h4>
    </div>
    <div class="card-body">
      <form id="purchaseOrderForm">
        <input type="hidden" id="po_id" name="po_id">
        
        <!-- 基本信息 -->
        <div class="mb-4">
          <h5 class="section-title">基本信息</h5>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="supplier_id" class="form-label">供应商 *</label>
              <select class="form-select" id="supplier_id" name="supplier_id" required>
                <option value="">请选择供应商</option>
              </select>
            </div>
            
            <div class="col-md-6 mb-3">
              <label for="employee_id" class="form-label">经办人 *</label>
              <select class="form-select" id="employee_id" name="employee_id" required>
                <option value="">请选择经办人</option>
              </select>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="po_date" class="form-label">采购日期 *</label>
              <input type="date" class="form-control" id="po_date" name="po_date" required>
            </div>
            
            <div class="col-md-6 mb-3">
              <label for="audit_status" class="form-label">审核状态</label>
              <select class="form-select" id="audit_status" name="audit_status">
                <option value="0">待审核</option>
                <option value="1">已审核</option>
                <option value="2">已拒绝</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> 返回
          </button>
          <div>
            <button type="reset" class="btn btn-outline-secondary me-2">
              <i class="bi bi-arrow-counterclockwise"></i> 重置
            </button>
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-circle"></i> <span id="submitBtnText">保存</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/purchase-order';
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('id');
const isEditMode = !!orderId;

// 页面初始化
document.addEventListener('DOMContentLoaded', async function() {
  // 设置页面标题
  if (isEditMode) {
    document.getElementById('formTitle').textContent = '编辑采购订单';
    document.getElementById('submitBtnText').textContent = '更新';
  }
  
  // 设置默认采购日期为今天
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('po_date').value = today;
  
  // 初始化下拉框数据
  await Promise.all([
    loadSuppliers(),
    loadEmployees()
  ]);
  
  // 如果是编辑模式，加载现有数据
  if (isEditMode) {
    await loadOrderData();
  }
});

// 加载供应商数据
async function loadSuppliers() {
  try {
    const response = await fetch('/supplier/list');
    const suppliers = await response.json();
    const select = document.getElementById('supplier_id');
    
    suppliers.forEach(supplier => {
      const option = document.createElement('option');
      option.value = supplier.supplier_id;
      option.textContent = `${supplier.supplier_id} - ${supplier.name}`;
      select.appendChild(option);
    });
  } catch (error) {
    console.error('加载供应商数据失败:', error);
  }
}

// 加载员工数据
async function loadEmployees() {
  try {
    const response = await fetch('/employee/list');
    const employees = await response.json();
    const select = document.getElementById('employee_id');
    
    employees.forEach(employee => {
      const option = document.createElement('option');
      option.value = employee.employee_id;
      option.textContent = `${employee.employee_id} - ${employee.name}`;
      select.appendChild(option);
    });
  } catch (error) {
    console.error('加载员工数据失败:', error);
  }
}

// 加载订单数据（编辑模式）
async function loadOrderData() {
  try {
    const response = await fetch(`${apiBase}/${orderId}`);
    if (!response.ok) {
      throw new Error('采购订单数据不存在');
    }
    
    const order = await response.json();
    
    // 填充表单数据
    document.getElementById('po_id').value = order.po_id;
    document.getElementById('supplier_id').value = order.supplier_id;
    document.getElementById('employee_id').value = order.employee_id;
    document.getElementById('po_date').value = order.po_date;
    document.getElementById('audit_status').value = order.audit_status || '0';
    
  } catch (error) {
    console.error('加载采购订单数据失败:', error);
    alert('加载采购订单数据失败：' + error.message);
    history.back();
  }
}

// 表单提交处理
document.getElementById('purchaseOrderForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  // 获取表单数据
  const formData = new FormData(this);
  const orderData = Object.fromEntries(formData.entries());
  
  // 数据验证
  if (!validateForm(orderData)) {
    return;
  }
  
  try {
    let response;
    
    if (isEditMode) {
      // 编辑模式 - PUT请求
      response = await fetch(`${apiBase}/${orderId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(orderData)
      });
    } else {
      // 新增模式 - POST请求
      response = await fetch(apiBase, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(orderData)
      });
    }
    
    if (response.ok) {
      const result = await response.json();
      alert(result.message || (isEditMode ? '采购订单更新成功！' : '采购订单添加成功！'));
      window.location.href = '/purchase-order';
    } else {
      const result = await response.json();
      alert('操作失败：' + (result.message || '未知错误'));
    }
  } catch (error) {
    console.error('提交失败:', error);
    alert('操作失败，请稍后重试');
  }
});

// 表单验证
function validateForm(data) {
  if (!data.supplier_id) {
    alert('请选择供应商');
    return false;
  }
  
  if (!data.employee_id) {
    alert('请选择经办人');
    return false;
  }
  
  if (!data.po_date) {
    alert('请选择采购日期');
    return false;
  }
  
  return true;
}
</script>
</body>
</html>
