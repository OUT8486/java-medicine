<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 药店管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 0;
        }
        .register-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .register-header p {
            color: #666;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .btn-register {
            background: #4f46e5;
            border: none;
            padding: 0.75rem;
            font-weight: 500;
            width: 100%;
            transition: background-color 0.3s;
        }
        .btn-register:hover {
            background: #4338ca;
        }
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .login-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 500;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .alert {
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .alert-danger {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }
        .alert-success {
            background-color: #efe;
            border: 1px solid #cfc;
            color: #3c3;
        }
        .password-strength {
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .strength-weak {
            color: #dc3545;
        }
        .strength-medium {
            color: #ffc107;
        }
        .strength-strong {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h2>药店管理系统</h2>
            <p>创建新账户</p>
        </div>
        
        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>
        
        <form id="registerForm" method="post" action="/register">
            <div class="form-group">
                <label for="user_id" class="form-label">用户ID</label>
                <input type="text" class="form-control" id="user_id" name="user_id" required placeholder="请输入用户ID">
                <small class="text-muted">用户ID将作为您的唯一标识符</small>
            </div>
            
            <div class="form-group">
                <label for="user_name" class="form-label">用户名</label>
                <input type="text" class="form-control" id="user_name" name="user_name" required placeholder="请输入用户名">
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="请输入密码">
                <div id="password-strength" class="password-strength"></div>
                <small class="text-muted">密码长度至少6位，建议包含字母和数字</small>
            </div>
            
            <div class="form-group">
                <label for="confirm_password" class="form-label">确认密码</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="请再次输入密码">
            </div>
            
            <div class="form-group">
                <label for="role" class="form-label">角色</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="">请选择角色</option>
                    <option value="管理员">管理员</option>
                    <option value="药师">药师</option>
                    <option value="销售员">销售员</option>
                    <option value="采购员">采购员</option>
                    <option value="用户">普通用户</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary btn-register">注册</button>
        </form>
        
        <div class="login-link">
            <p>已有账户？ <a href="/login">立即登录</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 密码强度检测
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthElement = document.getElementById('password-strength');
            
            if (password.length < 6) {
                strengthElement.textContent = '密码强度：弱';
                strengthElement.className = 'password-strength strength-weak';
            } else if (password.length < 10 && /[0-9]/.test(password) && /[a-zA-Z]/.test(password)) {
                strengthElement.textContent = '密码强度：中等';
                strengthElement.className = 'password-strength strength-medium';
            } else if (password.length >= 10 && /[0-9]/.test(password) && /[a-zA-Z]/.test(password) && /[^a-zA-Z0-9]/.test(password)) {
                strengthElement.textContent = '密码强度：强';
                strengthElement.className = 'password-strength strength-strong';
            } else if (/[0-9]/.test(password) && /[a-zA-Z]/.test(password)) {
                strengthElement.textContent = '密码强度：中等';
                strengthElement.className = 'password-strength strength-medium';
            } else {
                strengthElement.textContent = '密码强度：弱';
                strengthElement.className = 'password-strength strength-weak';
            }
        });
        
        // 表单验证和提交
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('user_id').value;
            const username = document.getElementById('user_name').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const role = document.getElementById('role').value;
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            // 隐藏之前的消息
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // 基本验证
            if (!userId || !username || !password || !confirmPassword || !role) {
                errorMessage.textContent = '请填写所有必填字段';
                errorMessage.style.display = 'block';
                return;
            }
            
            if (password.length < 6) {
                errorMessage.textContent = '密码长度至少需要6位';
                errorMessage.style.display = 'block';
                return;
            }
            
            if (password !== confirmPassword) {
                errorMessage.textContent = '两次输入的密码不一致';
                errorMessage.style.display = 'block';
                return;
            }
            
            // 创建表单数据
            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('user_name', username);
            formData.append('password', password);
            formData.append('role', role);
            
            // 发送注册请求
            fetch('/register', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 注册成功，显示成功消息并跳转
                    successMessage.textContent = data.message || '注册成功！正在跳转到登录页面...';
                    successMessage.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // 注册失败，显示错误信息
                    errorMessage.textContent = data.message || '注册失败，请检查输入信息或稍后重试';
                    errorMessage.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('注册错误:', error);
                errorMessage.textContent = '注册失败，请稍后重试';
                errorMessage.style.display = 'block';
            });
        });
        
        // 输入时隐藏错误信息
        const inputs = ['user_id', 'user_name', 'password', 'confirm_password', 'role'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', function() {
                document.getElementById('error-message').style.display = 'none';
                document.getElementById('success-message').style.display = 'none';
            });
        });
    </script>
</body>
</html>
