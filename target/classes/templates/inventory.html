<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .search-row .col {padding-right:8px;}
    .inventory-card { border-left: 4px solid #ffc107; }
    .stats-card { background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%); color: white; }
    .action-buttons .btn { margin: 0 2px; }
    .low-stock { background-color: #fff3cd; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/index"><i class="bi bi-house"></i> 返回首页</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <!-- 页面标题和统计 -->
  <div class="row mb-4">
    <div class="col-md-8">
      <h2><i class="bi bi-box-seam"></i> 库存管理</h2>
      <p class="text-muted">管理药品库存信息，监控库存数量和有效期</p>
    </div>
    <div class="col-md-4">
      <div class="card stats-card h-100">
        <div class="card-body text-center">
          <h5>库存记录数</h5>
          <h2 id="totalInventory">0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-plus-circle"></i> 新增库存
      </button>
      <button class="btn btn-outline-secondary" onclick="refreshData()">
        <i class="bi bi-arrow-clockwise"></i> 刷新
      </button>
    </div>
    <div class="d-flex gap-2">
      <select id="stockFilter" class="form-select" style="width: auto;" onchange="filterByStockLevel()">
        <option value="">全部库存</option>
        <option value="充足">库存充足</option>
        <option value="预警">库存预警</option>
        <option value="缺货">库存不足</option>
      </select>
    </div>
  </div>

  <!-- 搜索区域 -->
  <div class="card p-3 mb-4">
    <div class="row search-row g-2">
      <div class="col-md-3">
        <input id="q_drug_id" class="form-control" placeholder="药品ID">
      </div>
      <div class="col-md-3">
        <input id="q_batch_no" class="form-control" placeholder="批号">
      </div>
      <div class="col-md-3">
        <select id="q_warehouse_id" class="form-select">
          <option value="">仓库ID</option>
          <option value="1">1</option>
          <option value="2">2</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" onclick="searchInventory()">
          <i class="bi bi-search"></i> 搜索
        </button>
        <button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">
          <i class="bi bi-x-circle"></i> 重置
        </button>
      </div>
    </div>
  </div>

  <!-- 库存列表 -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>库存ID</th>
              <th>药品ID</th>
              <th>仓库ID</th>
              <th>批号</th>
              <th>数量</th>
              <th>有效期</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody">
            <tr>
              <td colspan="7" class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">加载中...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- 分页 -->
      <nav aria-label="库存列表分页">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
      </nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/inventory';
let currentInventory = [];
let currentPage = 1;
const pageSize = 10;

// 加载库存列表
async function loadInventory(page = 1, searchParams = {}) {
  try {
    showLoading();
    
    let url = `${apiBase}/list`;
    const response = await fetch(url);
    const data = await response.json();
    
    // 处理不同的响应格式
    let inventory = [];
    if (Array.isArray(data)) {
      inventory = data;
    } else if (data && data.inventory) {
      inventory = data.inventory;
    } else if (data && Array.isArray(data.list)) {
      inventory = data.list;
    }
    
    currentInventory = inventory;
    currentPage = page;
    
    // 应用搜索过滤
    const filteredInventory = filterInventory(inventory, searchParams);
    
    // 更新统计数据
    document.getElementById('totalInventory').textContent = inventory.length;
    
    // 显示数据
    displayInventory(filteredInventory);
    
  } catch (error) {
    console.error('加载库存列表失败:', error);
    showError('加载库存列表失败，请刷新重试');
  }
}

// 过滤库存数据
function filterInventory(inventory, searchParams) {
  return inventory.filter(item => {
    const drugMatch = !searchParams.drug_id || 
      (item.drug_id && item.drug_id.toLowerCase().includes(searchParams.drug_id.toLowerCase()));
    const batchMatch = !searchParams.batch_no || 
      (item.batch_no && item.batch_no.includes(searchParams.batch_no));
    const warehouseMatch = !searchParams.warehouse_id || item.warehouse_id == searchParams.warehouse_id;
    
    return drugMatch && batchMatch && warehouseMatch;
  });
}

// 显示库存列表
function displayInventory(inventory) {
  const tbody = document.getElementById('inventoryTableBody');
  
  if (!inventory || inventory.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无库存数据</td></tr>';
    return;
  }
  
  const startIndex = (currentPage - 1) * pageSize;
  const endIndex = Math.min(startIndex + pageSize, inventory.length);
  const pageInventory = inventory.slice(startIndex, endIndex);
  
  tbody.innerHTML = pageInventory.map(item => {
    const isLowStock = item.quantity <= 10;
    const rowClass = isLowStock ? 'low-stock' : '';
    
    return `
      <tr class="inventory-card ${rowClass}">
        <td><strong>${item.inventory_id || '-'}</strong></td>
        <td>${item.drug_id || '-'}</td>
        <td>${item.warehouse_id || '-'}</td>
        <td>${item.batch_no || '-'}</td>
        <td>
          <span class="${isLowStock ? 'text-danger fw-bold' : ''}">
            ${item.quantity || '0'}
          </span>
        </td>
        <td>${item.validity_date ? formatDate(item.validity_date) : '-'}</td>
        <td class="action-buttons">
          <button class="btn btn-sm btn-outline-primary" onclick="viewInventory('${item.inventory_id}')">
            <i class="bi bi-eye"></i> 查看
          </button>
          <button class="btn btn-sm btn-outline-secondary" onclick="editInventory('${item.inventory_id}')">
            <i class="bi bi-pencil"></i> 编辑
          </button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteInventory('${item.inventory_id}')">
            <i class="bi bi-trash"></i> 删除
          </button>
        </td>
      </tr>
    `;
  }).join('');
  
  // 更新分页
  updatePagination(inventory.length);
}

// 获取库存状态
function getStockStatus(quantity) {
  if (quantity <= 0) return '缺货';
  if (quantity <= 10) return '预警';
  return '充足';
}

// 获取库存状态对应的徽章样式
function getStockBadgeClass(status) {
  const statusClasses = {
    '充足': 'success',
    '预警': 'warning',
    '缺货': 'danger'
  };
  return statusClasses[status] || 'secondary';
}

// 获取仓库名称
function getWarehouseName(warehouseId) {
  const warehouses = {
    '1': '一号仓库',
    '2': '二号仓库'
  };
  return warehouses[warehouseId] || warehouseId;
}

// 格式化日期
function formatDate(dateString) {
  if (!dateString) return '-';
  const date = new Date(dateString);
  return date.toLocaleDateString('zh-CN');
}

// 更新分页控件
function updatePagination(totalCount) {
  const totalPages = Math.ceil(totalCount / pageSize);
  const pagination = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  
  let paginationHtml = '';
  
  // 上一页
  if (currentPage > 1) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a>
      </li>
    `;
  }
  
  // 页码
  for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
    paginationHtml += `
      <li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
      </li>
    `;
  }
  
  // 下一页
  if (currentPage < totalPages) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a>
      </li>
    `;
  }
  
  pagination.innerHTML = paginationHtml;
}

// 分页切换
function changePage(page) {
  currentPage = page;
  const searchParams = getSearchParams();
  displayInventory(filterInventory(currentInventory, searchParams));
}

// 获取搜索参数
function getSearchParams() {
  return {
    drug_id: document.getElementById('q_drug_id').value.trim(),
    batch_no: document.getElementById('q_batch_no').value.trim(),
    warehouse_id: document.getElementById('q_warehouse_id').value
  };
}

// 搜索功能
function searchInventory() {
  const searchParams = getSearchParams();
  const filteredInventory = filterInventory(currentInventory, searchParams);
  currentPage = 1;
  displayInventory(filteredInventory);
}

// 库存水平筛选
function filterByStockLevel() {
  // 这里可以根据库存水平进行筛选，暂时留空
  refreshData();
}

// 清空搜索
function clearSearch() {
  document.getElementById('q_drug_id').value = '';
  document.getElementById('q_batch_no').value = '';
  document.getElementById('q_warehouse_id').value = '';
  document.getElementById('stockFilter').value = '';
  currentPage = 1;
  displayInventory(currentInventory);
}

// 刷新数据
function refreshData() {
  loadInventory();
}

// 显示加载状态
function showLoading() {
  document.getElementById('inventoryTableBody').innerHTML = `
    <tr>
      <td colspan="8" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">加载中...</span>
        </div>
      </td>
    </tr>
  `;
}

// 显示错误信息
function showError(message) {
  document.getElementById('inventoryTableBody').innerHTML = `
    <tr>
      <td colspan="8" class="text-center text-danger">
        <i class="bi bi-exclamation-triangle"></i> ${message}
      </td>
    </tr>
  `;
}

// 查看库存详情
function viewInventory(id) {
  // 库存通常没有单独的详情页面，这里跳转到编辑页面
  window.location.href = `/inventory/form?id=${id}`;
}

// 编辑库存
function editInventory(id) {
  window.location.href = `/inventory/form?id=${id}`;
}

// 新增库存
function openAddModal() {
  window.location.href = '/inventory/form';
}

// 删除库存
async function deleteInventory(id) {
  if (!confirm('确定要删除这个库存记录吗？此操作不可恢复！')) {
    return;
  }
  
  try {
    const response = await fetch(`${apiBase}/${id}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      }
    });
    
    if (response.ok) {
      alert('库存记录删除成功！');
      loadInventory();
    } else {
      const result = await response.json();
      alert(`删除失败：${result.message || '未知错误'}`);
    }
  } catch (error) {
    console.error('删除库存记录失败:', error);
    alert('删除失败，请稍后重试');
  }
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
  loadInventory();
  
  // 回车键搜索
  document.getElementById('q_drug_id').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchInventory();
  });
  
  document.getElementById('q_batch_no').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchInventory();
  });
});
</script>
</body>
</html>
