<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.container{max-width:800px}</style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/index">药店管理系统</a></div></nav>
  <div class="container mt-4">
    <h3 id="title">客户 - 新建</h3>
    <form id="form" class="card p-3">
      <div class="mb-3"><label class="form-label">客户ID</label><input id="customer_id" class="form-control"></div>
      <div class="mb-3"><label class="form-label">姓名</label><input id="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">类型</label><input id="type" class="form-control"></div>
      <div class="mb-3"><label class="form-label">联系电话</label><input id="contact_phone" class="form-control"></div>
      <div class="d-flex gap-2"><button class="btn btn-primary">保存</button><a class="btn btn-secondary" href="/customer">返回</a></div>
    </form>
  </div>
  <script>
    function qs(name){const u=new URLSearchParams(location.search);return u.get(name);} 
    const id = qs('id');
    if(id){ document.getElementById('title').textContent='客户 - 编辑'; fetch(`/customer/${id}`).then(r=>r.json()).then(c=>{ c=c||{}; document.getElementById('customer_id').value=c.customer_id||''; document.getElementById('name').value=c.name||''; document.getElementById('type').value=c.type||''; document.getElementById('contact_phone').value=c.contact_phone||'';}).catch(e=>console.error(e)); }

    document.getElementById('form').addEventListener('submit', function(e){
      e.preventDefault();
      const payload = {
        customer_id: document.getElementById('customer_id').value,
        name: document.getElementById('name').value,
        type: document.getElementById('type').value,
        contact_phone: document.getElementById('contact_phone').value
      };
      const url = id ? `/customer/${id}` : '/customer';
      const method = id ? 'PUT' : 'POST';
      fetch(url, {method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
        .then(r=>{ if(r.ok) location.href='/customer'; else alert('保存失败'); })
        .catch(e=>{ console.error(e); alert('保存失败'); });
    });
  </script>
</body>
</html>
