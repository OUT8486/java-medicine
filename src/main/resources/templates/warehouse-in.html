<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入库管理 - 药店管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
        }

        .card {
            border: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .btn-action {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            margin: 0 0.125rem;
        }

        .table th {
            background-color: #f8f9fa;
            border-top: none;
        }

        .search-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>入库管理</h2>
            <button class="btn btn-primary rounded-pill" onclick="showAddModal()"><i class="bi bi-plus-circle me-1"></i>
                新增入库单</button>
        </div>

        <div class="card p-3 mb-3">
            <div class="row g-2 mb-3">
                <div class="col-md-3"><input type="text" class="form-control" id="searchPoId" placeholder="采购订单ID">
                </div>
                <div class="col-md-3"><input type="text" class="form-control" id="searchWarehouseId" placeholder="仓库ID">
                </div>
                <div class="col-md-3"><input type="text" class="form-control" id="searchBatchNo" placeholder="批号"></div>
                <div class="col-md-3 d-flex gap-2 align-items-center"><button class="btn btn-outline-primary"
                        onclick="searchWarehouseIns()"><i class="bi bi-search"></i> 搜索</button> <button
                        class="btn btn-outline-secondary" onclick="resetSearch()">重置</button></div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>入库单ID</th>
                            <th>采购订单ID</th>
                            <th>仓库ID</th>
                            <th>入库日期</th>
                            <th>批号</th>
                            <th>有效期</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="warehouseInTableBody">
                        <tr>
                            <td colspan="7" class="text-center">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav>
                <ul class="pagination justify-content-center" id="pagination"></ul>
            </nav>
        </div>
    </div>

    <div class="modal fade" id="warehouseInModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="warehouseInModalTitle">新增入库单</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="warehouseInForm"><input type="hidden" id="warehouseInId">
                        <div class="mb-3"><label class="form-label">采购订单ID</label><input type="text"
                                class="form-control" id="poId" required></div>
                        <div class="mb-3"><label class="form-label">仓库ID</label><input type="text" class="form-control"
                                id="warehouseId" required></div>
                        <div class="mb-3"><label class="form-label">入库日期</label><input type="date" class="form-control"
                                id="inDate" required></div>
                        <div class="mb-3"><label class="form-label">批号</label><input type="text" class="form-control"
                                id="batchNo" required></div>
                        <div class="mb-3"><label class="form-label">有效期</label><input type="date" class="form-control"
                                id="validityDate" required></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">取消</button><button type="button" class="btn btn-primary"
                        onclick="saveWarehouseIn()">保存</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentEditId = null; let currentPage = 1; let pageSize = 10; let totalItems = 0;
        function normalizeListResponse(data) { if (Array.isArray(data)) return { items: data, total: data.length }; if (data && typeof data === 'object') { for (const k of Object.keys(data)) { if (Array.isArray(data[k])) return { items: data[k], total: data.total || data[k].length } } if (Array.isArray(data.items)) return { items: data.items, total: data.total || data.items.length } } return { items: [], total: 0 } }
        document.addEventListener('DOMContentLoaded', function () { loadWarehouseIns(); });
        function loadWarehouseIns() { const searchPoId = document.getElementById('searchPoId').value; const searchWarehouseId = document.getElementById('searchWarehouseId').value; const searchBatchNo = document.getElementById('searchBatchNo').value; let url = '/warehouse-in/list?page=' + currentPage + '&size=' + pageSize; if (searchPoId) url += '&poId=' + encodeURIComponent(searchPoId); if (searchWarehouseId) url += '&warehouseId=' + encodeURIComponent(searchWarehouseId); if (searchBatchNo) url += '&batchNo=' + encodeURIComponent(searchBatchNo); fetch(url).then(r => r.json()).then(data => { const { items, total } = normalizeListResponse(data); displayWarehouseIns(items); updatePagination(total); }).catch(e => { console.error(e); document.getElementById('warehouseInTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger">数据加载失败</td></tr>'; }); }
        function displayWarehouseIns(items) { const tbody = document.getElementById('warehouseInTableBody'); if (!items || items.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center">暂无入库单数据</td></tr>'; return } tbody.innerHTML = items.map(wi => `<tr><td>${wi.wi_id || ''}</td><td>${wi.po_id || ''}</td><td>${wi.warehouse_id || ''}</td><td>${wi.in_date || ''}</td><td>${wi.batch_no || ''}</td><td>${wi.validity_date || ''}</td><td><button class="btn btn-sm btn-outline-primary" onclick="editWarehouseIn('${wi.wi_id}')">编辑</button> <button class="btn btn-sm btn-outline-danger" onclick="deleteWarehouseIn('${wi.wi_id}')">删除</button></td></tr>`).join(''); }
        function showAddModal() { currentEditId = null; document.getElementById('warehouseInForm').reset(); document.getElementById('inDate').value = new Date().toISOString().split('T')[0]; new bootstrap.Modal(document.getElementById('warehouseInModal')).show(); }
        function searchWarehouseIns() { currentPage = 1; loadWarehouseIns(); }
        function resetSearch() { document.getElementById('searchPoId').value = ''; document.getElementById('searchWarehouseId').value = ''; document.getElementById('searchBatchNo').value = ''; currentPage = 1; loadWarehouseIns(); }
        function saveWarehouseIn() { const data = { wi_id: document.getElementById('warehouseInId').value, po_id: document.getElementById('poId').value, warehouse_id: document.getElementById('warehouseId').value, in_date: document.getElementById('inDate').value, batch_no: document.getElementById('batchNo').value, validity_date: document.getElementById('validityDate').value }; const url = currentEditId ? '/warehouse-in/' + currentEditId : '/warehouse-in'; const method = currentEditId ? 'PUT' : 'POST'; fetch(url, { method: method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(() => { bootstrap.Modal.getInstance(document.getElementById('warehouseInModal')).hide(); loadWarehouseIns(); }).catch(e => { console.error(e); alert('保存失败'); }); }
        function editWarehouseIn(id) {
            if (!id) return;
            fetch(`/warehouse-in/${id}`).then(r => { if (!r.ok) throw new Error('未找到'); return r.json(); }).then(d => {
                const wi = d || {};
                currentEditId = id;
                document.getElementById('warehouseInId').value = wi.wi_id || '';
                document.getElementById('poId').value = wi.po_id || '';
                document.getElementById('warehouseId').value = wi.warehouse_id || '';
                document.getElementById('inDate').value = wi.in_date || '';
                document.getElementById('batchNo').value = wi.batch_no || '';
                document.getElementById('validityDate').value = wi.validity_date || '';
                new bootstrap.Modal(document.getElementById('warehouseInModal')).show();
            }).catch(e => { console.error(e); alert('加载入库单失败'); });
        }

        function deleteWarehouseIn(id) {
            if (!id) return; if (!confirm('确认删除入库单 ' + id + ' ?')) return;
            fetch(`/warehouse-in/${id}`, { method: 'DELETE' })
                .then(r => { if (r.ok) { loadWarehouseIns(); alert('删除成功'); } else { alert('删除失败'); } })
                .catch(e => { console.error(e); alert('删除失败'); });
        }
        function updatePagination(total) { totalItems = total; const totalPages = Math.ceil(totalItems / pageSize); const pagination = document.getElementById('pagination'); let html = ''; html += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a></li>`; for (let i = 1; i <= totalPages; i++) { if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) { html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>` } else if (i === currentPage - 2 || i === currentPage + 2) { html += `<li class="page-item disabled"><a class="page-link" href="#">...</a></li>` } } html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a></li>`; pagination.innerHTML = html; }
        function changePage(p) { if (p < 1 || p > Math.ceil(totalItems / pageSize)) return; currentPage = p; loadWarehouseIns(); }
    </script>
</body>

</html>
