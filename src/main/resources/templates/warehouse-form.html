<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库信息</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .form-container { max-width: 800px; margin: 2rem auto; }
    .section-title { border-bottom: 2px solid #0d6efd; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    .readonly-field { background-color: #f8f9fa; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/warehouse"><i class="bi bi-building"></i> 仓库管理</a>
      <a class="nav-link" href="/index"><i class="bi bi-house"></i> 返回首页</a>
    </div>
  </div>
</nav>

<div class="container form-container">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">
        <i class="bi bi-building"></i> 
        <span id="formTitle">新增仓库</span>
      </h4>
    </div>
    <div class="card-body">
      <form id="warehouseForm">
        <input type="hidden" id="warehouse_id" name="warehouse_id">
        
        <!-- 基本信息 -->
        <div class="mb-4">
          <h5 class="section-title">基本信息</h5>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="name" class="form-label">仓库名称 *</label>
              <input type="text" class="form-control" id="name" name="name" 
                     placeholder="请输入仓库名称" required>
            </div>
            
            <div class="col-md-6 mb-3">
              <label for="location" class="form-label">仓库位置 *</label>
              <input type="text" class="form-control" id="location" name="location" 
                     placeholder="请输入仓库位置" required>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> 返回
          </button>
          <div>
            <button type="reset" class="btn btn-outline-secondary me-2">
              <i class="bi bi-arrow-counterclockwise"></i> 重置
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> <span id="submitBtnText">保存</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/warehouse';
const urlParams = new URLSearchParams(window.location.search);
const warehouseId = urlParams.get('id');
const isEditMode = !!warehouseId;

// 页面初始化
document.addEventListener('DOMContentLoaded', async function() {
  // 设置页面标题
  if (isEditMode) {
    document.getElementById('formTitle').textContent = '编辑仓库';
    document.getElementById('submitBtnText').textContent = '更新';
  }
  
  // 如果是编辑模式，加载现有数据
  if (isEditMode) {
    await loadWarehouseData();
  }
});

// 加载仓库数据（编辑模式）
async function loadWarehouseData() {
  try {
    const response = await fetch(`${apiBase}/${warehouseId}`);
    if (!response.ok) {
      throw new Error('仓库数据不存在');
    }
    
    const warehouse = await response.json();
    
    // 填充表单数据
    document.getElementById('warehouse_id').value = warehouse.warehouse_id;
    document.getElementById('name').value = warehouse.name;
    document.getElementById('location').value = warehouse.location;
    
  } catch (error) {
    console.error('加载仓库数据失败:', error);
    alert('加载仓库数据失败：' + error.message);
    history.back();
  }
}

// 表单提交处理
document.getElementById('warehouseForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  // 获取表单数据
  const formData = new FormData(this);
  const warehouseData = Object.fromEntries(formData.entries());
  
  // 数据验证
  if (!validateForm(warehouseData)) {
    return;
  }
  
  try {
    let response;
    
    if (isEditMode) {
      // 编辑模式 - PUT请求
      response = await fetch(`${apiBase}/${warehouseId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(warehouseData)
      });
    } else {
      // 新增模式 - POST请求
      response = await fetch(apiBase, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(warehouseData)
      });
    }
    
    if (response.ok) {
      const result = await response.json();
      alert(result.message || (isEditMode ? '仓库更新成功！' : '仓库添加成功！'));
      window.location.href = '/warehouse';
    } else {
      const result = await response.json();
      alert('操作失败：' + (result.message || '未知错误'));
    }
  } catch (error) {
    console.error('提交失败:', error);
    alert('操作失败，请稍后重试');
  }
});

// 表单验证
function validateForm(data) {
  if (!data.name || !data.name.trim()) {
    alert('请输入仓库名称');
    return false;
  }
  
  if (!data.location || !data.location.trim()) {
    alert('请输入仓库位置');
    return false;
  }
  
  return true;
}
</script>
</body>
</html>
