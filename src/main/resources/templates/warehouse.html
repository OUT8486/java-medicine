<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仓库管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .search-row .col {padding-right:8px;}
    .warehouse-card { border-left: 4px solid #20c997; }
    .stats-card { background: linear-gradient(135deg, #20c997 0%, #198754 100%); color: white; }
    .action-buttons .btn { margin: 0 2px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/index"><i class="bi bi-house"></i> 返回首页</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <!-- 页面标题和统计 -->
  <div class="row mb-4">
    <div class="col-md-8">
      <h2><i class="bi bi-house-door"></i> 仓库管理</h2>
      <p class="text-muted">管理仓库基本信息和位置信息</p>
    </div>
    <div class="col-md-4">
      <div class="card stats-card h-100">
        <div class="card-body text-center">
          <h5>仓库总数</h5>
          <h2 id="totalWarehouses">0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-plus-circle"></i> 新增仓库
      </button>
      <button class="btn btn-outline-secondary" onclick="refreshData()">
        <i class="bi bi-arrow-clockwise"></i> 刷新
      </button>
    </div>
  </div>

  <!-- 搜索区域 -->
  <div class="card p-3 mb-4">
    <div class="row search-row g-2">
      <div class="col-md-4">
        <input id="q_name" class="form-control" placeholder="仓库名称">
      </div>
      <div class="col-md-4">
        <input id="q_location" class="form-control" placeholder="仓库位置">
      </div>
      <div class="col-md-4 d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" onclick="searchWarehouses()">
          <i class="bi bi-search"></i> 搜索
        </button>
        <button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">
          <i class="bi bi-x-circle"></i> 重置
        </button>
      </div>
    </div>
  </div>

  <!-- 仓库列表 -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>仓库ID</th>
              <th>仓库名称</th>
              <th>位置</th>
              <th>容量</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="warehouseTableBody">
            <tr>
              <td colspan="5" class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">加载中...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- 分页 -->
      <nav aria-label="仓库列表分页">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
      </nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/warehouse';
let currentWarehouses = [];
let currentPage = 1;
const pageSize = 10;

// 加载仓库列表
async function loadWarehouses(page = 1, searchParams = {}) {
  try {
    showLoading();
    
    let url = `${apiBase}/list`;
    const response = await fetch(url);
    const data = await response.json();
    
    // 处理不同的响应格式
    let warehouses = [];
    if (Array.isArray(data)) {
      warehouses = data;
    } else if (data && data.warehouses) {
      warehouses = data.warehouses;
    } else if (data && Array.isArray(data.list)) {
      warehouses = data.list;
    }
    
    currentWarehouses = warehouses;
    currentPage = page;
    
    // 应用搜索过滤
    const filteredWarehouses = filterWarehouses(warehouses, searchParams);
    
    // 更新统计数据
    document.getElementById('totalWarehouses').textContent = warehouses.length;
    
    // 显示数据
    displayWarehouses(filteredWarehouses);
    
  } catch (error) {
    console.error('加载仓库列表失败:', error);
    showError('加载仓库列表失败，请刷新重试');
  }
}

// 过滤仓库数据
function filterWarehouses(warehouses, searchParams) {
  return warehouses.filter(warehouse => {
    const nameMatch = !searchParams.name || 
      (warehouse.name && warehouse.name.toLowerCase().includes(searchParams.name.toLowerCase()));
    const locationMatch = !searchParams.location || 
      (warehouse.location && warehouse.location.toLowerCase().includes(searchParams.location.toLowerCase()));
    
    return nameMatch && locationMatch;
  });
}

// 显示仓库列表
function displayWarehouses(warehouses) {
  const tbody = document.getElementById('warehouseTableBody');
  
  if (!warehouses || warehouses.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">暂无仓库数据</td></tr>';
    return;
  }
  
  const startIndex = (currentPage - 1) * pageSize;
  const endIndex = Math.min(startIndex + pageSize, warehouses.length);
  const pageWarehouses = warehouses.slice(startIndex, endIndex);
  
  tbody.innerHTML = pageWarehouses.map(warehouse => `
    <tr class="warehouse-card">
      <td><strong>${warehouse.warehouse_id || '-'}</strong></td>
      <td>${warehouse.name || '-'}</td>
      <td>${warehouse.location || '-'}</td>
      <td>${warehouse.capacity || '-'}</td>
      <td class="action-buttons">
        <button class="btn btn-sm btn-outline-primary" onclick="viewWarehouse('${warehouse.warehouse_id}')">
          <i class="bi bi-eye"></i> 查看
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="editWarehouse('${warehouse.warehouse_id}')">
          <i class="bi bi-pencil"></i> 编辑
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteWarehouse('${warehouse.warehouse_id}')">
          <i class="bi bi-trash"></i> 删除
        </button>
      </td>
    </tr>
  `).join('');
  
  // 更新分页
  updatePagination(warehouses.length);
}

// 更新分页控件
function updatePagination(totalCount) {
  const totalPages = Math.ceil(totalCount / pageSize);
  const pagination = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  
  let paginationHtml = '';
  
  // 上一页
  if (currentPage > 1) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a>
      </li>
    `;
  }
  
  // 页码
  for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
    paginationHtml += `
      <li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
      </li>
    `;
  }
  
  // 下一页
  if (currentPage < totalPages) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a>
      </li>
    `;
  }
  
  pagination.innerHTML = paginationHtml;
}

// 分页切换
function changePage(page) {
  currentPage = page;
  const searchParams = getSearchParams();
  displayWarehouses(filterWarehouses(currentWarehouses, searchParams));
}

// 获取搜索参数
function getSearchParams() {
  return {
    name: document.getElementById('q_name').value.trim(),
    location: document.getElementById('q_location').value.trim()
  };
}

// 搜索功能
function searchWarehouses() {
  const searchParams = getSearchParams();
  const filteredWarehouses = filterWarehouses(currentWarehouses, searchParams);
  currentPage = 1;
  displayWarehouses(filteredWarehouses);
}

// 清空搜索
function clearSearch() {
  document.getElementById('q_name').value = '';
  document.getElementById('q_location').value = '';
  currentPage = 1;
  displayWarehouses(currentWarehouses);
}

// 刷新数据
function refreshData() {
  loadWarehouses();
}

// 显示加载状态
function showLoading() {
  document.getElementById('warehouseTableBody').innerHTML = `
    <tr>
      <td colspan="5" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">加载中...</span>
        </div>
      </td>
    </tr>
  `;
}

// 显示错误信息
function showError(message) {
  document.getElementById('warehouseTableBody').innerHTML = `
    <tr>
      <td colspan="5" class="text-center text-danger">
        <i class="bi bi-exclamation-triangle"></i> ${message}
      </td>
    </tr>
  `;
}

// 查看仓库详情
function viewWarehouse(id) {
  window.location.href = `/warehouse/form?id=${id}`;
}

// 编辑仓库
function editWarehouse(id) {
  window.location.href = `/warehouse/form?id=${id}`;
}

// 新增仓库
function openAddModal() {
  window.location.href = '/warehouse/form';
}

// 删除仓库
async function deleteWarehouse(id) {
  if (!confirm('确定要删除这个仓库吗？此操作不可恢复！')) {
    return;
  }
  
  try {
    const response = await fetch(`${apiBase}/${id}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      }
    });
    
    if (response.ok) {
      alert('仓库删除成功！');
      loadWarehouses();
    } else {
      const result = await response.json();
      alert(`删除失败：${result.message || '未知错误'}`);
    }
  } catch (error) {
    console.error('删除仓库失败:', error);
    alert('删除失败，请稍后重试');
  }
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
  loadWarehouses();
  
  // 回车键搜索
  document.getElementById('q_name').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchWarehouses();
  });
  
  document.getElementById('q_location').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchWarehouses();
  });
});
</script>
</body>
</html>
