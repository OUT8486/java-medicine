<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库管理 - 药店管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>.navbar-brand{font-weight:bold}.card{box-shadow:0 0 10px rgba(0,0,0,0.05)}</style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/index">药店管理系统</a><div class="navbar-nav ms-auto"><a class="nav-link" href="/index">返回首页</a></div></div></nav>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4"><h2>仓库管理</h2><button class="btn btn-primary" onclick="showAdd()">添加仓库</button></div>

        <div class="card p-3 mb-3">
            <div class="row g-2">
                <div class="col-md-4"><input id="q_name" class="form-control" placeholder="仓库名称或ID"></div>
                <div class="col-md-4"><input id="q_location" class="form-control" placeholder="位置"></div>
                <div class="col-md-4 d-flex gap-2"><button type="button" class="btn btn-outline-primary" onclick="loadList()">搜索</button><button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">重置</button></div>
            </div>
        </div>

        <div class="card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>仓库ID</th><th>仓库名称</th><th>位置</th><th>操作</th></tr></thead><tbody id="warehouseTableBody"><tr><td colspan="4" class="text-center">加载中...</td></tr></tbody></table></div></div>
    </div>
    <script>
        function extractItems(data){ if(Array.isArray(data)) return data; if(!data) return []; for(const k of Object.keys(data)){ if(Array.isArray(data[k])) return data[k]; } return []; }

        function renderWarehouseList(items){ const tb = document.getElementById('warehouseTableBody'); if(!items||items.length===0){ tb.innerHTML = '<tr><td colspan="4" class="text-center">暂无数据</td></tr>'; return; } tb.innerHTML = items.map(w=>`<tr><td>${w.warehouse_id||''}</td><td>${w.name||''}</td><td>${w.location||''}</td><td><button class="btn btn-sm btn-outline-primary">编辑</button></td></tr>`).join(''); }

        function clearSearch(){ document.getElementById('q_name').value=''; document.getElementById('q_location').value=''; loadList(); }

        async function loadList(){
            const tb = document.getElementById('warehouseTableBody'); tb.innerHTML = '<tr><td colspan="4" class="text-center">加载中...</td></tr>';
            const terms = Array.from(document.querySelectorAll('[id^="q_"] , [id^="search"]')).map(i=> (i.value||'').toString().trim().toLowerCase()).filter(Boolean);
            try{
                const res = await fetch('/warehouse/list');
                const d = await res.json();
                const items = extractItems(d);
                const filtered = items.filter(it=>{ const s = JSON.stringify(it).toLowerCase(); return terms.every(t=> s.includes(t)); });
                renderWarehouseList(filtered);
            }catch(e){ console.error(e); tb.innerHTML = '<tr><td colspan="4" class="text-center text-danger">加载失败</td></tr>'; }
        }

        document.addEventListener('DOMContentLoaded', loadList);
    </script>
</body>
</html>
