<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>供应商管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .search-row .col {padding-right:8px;}
    .supplier-card { border-left: 4px solid #6f42c1; }
    .stats-card { background: linear-gradient(135deg, #6f42c1 0%, #5a32a3 100%); color: white; }
    .action-buttons .btn { margin: 0 2px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/index"><i class="bi bi-house"></i> 返回首页</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <!-- 页面标题和统计 -->
  <div class="row mb-4">
    <div class="col-md-8">
      <h2><i class="bi bi-truck"></i> 供应商管理</h2>
      <p class="text-muted">管理药品供应商信息，维护供应商合作关系</p>
    </div>
    <div class="col-md-4">
      <div class="card stats-card h-100">
        <div class="card-body text-center">
          <h5>供应商总数</h5>
          <h2 id="totalSuppliers">0</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="bi bi-building-add"></i> 新增供应商
      </button>
      <button class="btn btn-outline-secondary" onclick="refreshData()">
        <i class="bi bi-arrow-clockwise"></i> 刷新
      </button>
    </div>
    <div class="d-flex gap-2">
      <select id="statusFilter" class="form-select" style="width: auto;" onchange="filterByStatus()">
        <option value="">全部状态</option>
        <option value="合作中">合作中</option>
        <option value="暂停合作">暂停合作</option>
        <option value="终止合作">终止合作</option>
      </select>
    </div>
  </div>

  <!-- 搜索区域 -->
  <div class="card p-3 mb-4">
    <div class="row search-row g-2">
      <div class="col-md-3">
        <input id="q_name" class="form-control" placeholder="供应商名称">
      </div>
      <div class="col-md-3">
        <input id="q_contact" class="form-control" placeholder="联系人">
      </div>
      <div class="col-md-3">
        <select id="q_status" class="form-select">
          <option value="">合作状态</option>
          <option value="合作中">合作中</option>
          <option value="暂停合作">暂停合作</option>
          <option value="终止合作">终止合作</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" onclick="searchSuppliers()">
          <i class="bi bi-search"></i> 搜索
        </button>
        <button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">
          <i class="bi bi-x-circle"></i> 重置
        </button>
      </div>
    </div>
  </div>

  <!-- 供应商列表 -->
  <div class="card">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>供应商ID</th>
              <th>供应商名称</th>
              <th>联系人</th>
              <th>联系电话</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="supplierTableBody">
            <tr>
              <td colspan="6" class="text-center">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">加载中...</span>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <!-- 分页 -->
      <nav aria-label="供应商列表分页">
        <ul class="pagination justify-content-center" id="pagination">
        </ul>
      </nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/supplier';
let currentSuppliers = [];
let currentPage = 1;
const pageSize = 10;

// 加载供应商列表
async function loadSuppliers(page = 1, searchParams = {}) {
  try {
    showLoading();
    
    let url = `${apiBase}/list`;
    const response = await fetch(url);
    const data = await response.json();
    
    // 处理不同的响应格式
    let suppliers = [];
    if (Array.isArray(data)) {
      suppliers = data;
    } else if (data && data.suppliers) {
      suppliers = data.suppliers;
    } else if (data && Array.isArray(data.list)) {
      suppliers = data.list;
    }
    
    currentSuppliers = suppliers;
    currentPage = page;
    
    // 应用搜索过滤
    const filteredSuppliers = filterSuppliers(suppliers, searchParams);
    
    // 更新统计数据
    document.getElementById('totalSuppliers').textContent = suppliers.length;
    
    // 显示数据
    displaySuppliers(filteredSuppliers);
    
  } catch (error) {
    console.error('加载供应商列表失败:', error);
    showError('加载供应商列表失败，请刷新重试');
  }
}

// 过滤供应商数据
function filterSuppliers(suppliers, searchParams) {
  return suppliers.filter(supplier => {
    const nameMatch = !searchParams.name || 
      (supplier.name && supplier.name.toLowerCase().includes(searchParams.name.toLowerCase()));
    const contactMatch = !searchParams.contact || 
      (supplier.contact_person && supplier.contact_person.toLowerCase().includes(searchParams.contact.toLowerCase()));
    const statusMatch = !searchParams.status || supplier.status === searchParams.status;
    
    return nameMatch && contactMatch && statusMatch;
  });
}

// 显示供应商列表
function displaySuppliers(suppliers) {
  const tbody = document.getElementById('supplierTableBody');
  
  if (!suppliers || suppliers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无供应商数据</td></tr>';
    return;
  }
  
  const startIndex = (currentPage - 1) * pageSize;
  const endIndex = Math.min(startIndex + pageSize, suppliers.length);
  const pageSuppliers = suppliers.slice(startIndex, endIndex);
  
  tbody.innerHTML = pageSuppliers.map(supplier => `
    <tr class="supplier-card">
      <td><strong>${supplier.supplier_id || '-'}</strong></td>
      <td>${supplier.name || '-'}</td>
      <td>${supplier.contact_person || '-'}</td>
      <td>${supplier.phone || '-'}</td>
      <td>
        <span class="badge bg-${getStatusBadgeClass(supplier.status)}">
          ${supplier.status || '-'}
        </span>
      </td>
      <td class="action-buttons">
        <button class="btn btn-sm btn-outline-primary" onclick="viewSupplier('${supplier.supplier_id}')">
          <i class="bi bi-eye"></i> 查看
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="editSupplier('${supplier.supplier_id}')">
          <i class="bi bi-pencil"></i> 编辑
        </button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteSupplier('${supplier.supplier_id}')">
          <i class="bi bi-trash"></i> 删除
        </button>
      </td>
    </tr>
  `).join('');
  
  // 更新分页
  updatePagination(suppliers.length);
}

// 获取状态对应的徽章样式
function getStatusBadgeClass(status) {
  const statusClasses = {
    '合作中': 'success',
    '暂停合作': 'warning',
    '终止合作': 'danger'
  };
  return statusClasses[status] || 'secondary';
}

// 更新分页控件
function updatePagination(totalCount) {
  const totalPages = Math.ceil(totalCount / pageSize);
  const pagination = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    pagination.innerHTML = '';
    return;
  }
  
  let paginationHtml = '';
  
  // 上一页
  if (currentPage > 1) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">上一页</a>
      </li>
    `;
  }
  
  // 页码
  for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
    paginationHtml += `
      <li class="page-item ${i === currentPage ? 'active' : ''}">
        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
      </li>
    `;
  }
  
  // 下一页
  if (currentPage < totalPages) {
    paginationHtml += `
      <li class="page-item">
        <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">下一页</a>
      </li>
    `;
  }
  
  pagination.innerHTML = paginationHtml;
}

// 分页切换
function changePage(page) {
  currentPage = page;
  const searchParams = getSearchParams();
  displaySuppliers(filterSuppliers(currentSuppliers, searchParams));
}

// 获取搜索参数
function getSearchParams() {
  return {
    name: document.getElementById('q_name').value.trim(),
    contact: document.getElementById('q_contact').value.trim(),
    status: document.getElementById('q_status').value
  };
}

// 搜索功能
function searchSuppliers() {
  const searchParams = getSearchParams();
  const filteredSuppliers = filterSuppliers(currentSuppliers, searchParams);
  currentPage = 1;
  displaySuppliers(filteredSuppliers);
}

// 状态筛选
function filterByStatus() {
  const status = document.getElementById('statusFilter').value;
  document.getElementById('q_status').value = status;
  searchSuppliers();
}

// 清空搜索
function clearSearch() {
  document.getElementById('q_name').value = '';
  document.getElementById('q_contact').value = '';
  document.getElementById('q_status').value = '';
  document.getElementById('statusFilter').value = '';
  currentPage = 1;
  displaySuppliers(currentSuppliers);
}

// 刷新数据
function refreshData() {
  loadSuppliers();
}

// 显示加载状态
function showLoading() {
  document.getElementById('supplierTableBody').innerHTML = `
    <tr>
      <td colspan="6" class="text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">加载中...</span>
        </div>
      </td>
    </tr>
  `;
}

// 显示错误信息
function showError(message) {
  document.getElementById('supplierTableBody').innerHTML = `
    <tr>
      <td colspan="6" class="text-center text-danger">
        <i class="bi bi-exclamation-triangle"></i> ${message}
      </td>
    </tr>
  `;
}

// 查看供应商详情
function viewSupplier(id) {
  window.location.href = `/supplier/form?id=${id}`;
}

// 编辑供应商
function editSupplier(id) {
  window.location.href = `/supplier/form?id=${id}`;
}

// 新增供应商
function openAddModal() {
  window.location.href = '/supplier/form';
}

// 删除供应商
async function deleteSupplier(id) {
  if (!confirm('确定要删除这个供应商吗？此操作不可恢复！')) {
    return;
  }
  
  try {
    const response = await fetch(`${apiBase}/${id}`, {
      method: 'DELETE',
      headers: {
        'Content-Type': 'application/json'
      }
    });
    
    if (response.ok) {
      alert('供应商删除成功！');
      loadSuppliers();
    } else {
      const result = await response.json();
      alert(`删除失败：${result.message || '未知错误'}`);
    }
  } catch (error) {
    console.error('删除供应商失败:', error);
    alert('删除失败，请稍后重试');
  }
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
  loadSuppliers();
  
  // 回车键搜索
  document.getElementById('q_name').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchSuppliers();
  });
  
  document.getElementById('q_contact').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchSuppliers();
  });
});
</script>
</body>
</html>
