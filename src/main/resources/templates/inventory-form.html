<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>库存信息</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .form-container { max-width: 800px; margin: 2rem auto; }
    .section-title { border-bottom: 2px solid #ffc107; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    .readonly-field { background-color: #f8f9fa; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/inventory"><i class="bi bi-box-seam"></i> 库存管理</a>
      <a class="nav-link" href="/index"><i class="bi bi-house"></i> 返回首页</a>
    </div>
  </div>
</nav>

<div class="container form-container">
  <div class="card shadow">
    <div class="card-header bg-warning text-white">
      <h4 class="mb-0">
        <i class="bi bi-box-seam"></i> 
        <span id="formTitle">新增库存</span>
      </h4>
    </div>
    <div class="card-body">
      <form id="inventoryForm">
        <input type="hidden" id="inventory_id" name="inventory_id">
        
        <!-- 基本信息 -->
        <div class="mb-4">
          <h5 class="section-title">基本信息</h5>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="drug_id" class="form-label">药品ID *</label>
              <select class="form-select" id="drug_id" name="drug_id" required>
                <option value="">请选择药品</option>
              </select>
            </div>
            
            <div class="col-md-6 mb-3">
              <label for="warehouse_id" class="form-label">仓库ID *</label>
              <select class="form-select" id="warehouse_id" name="warehouse_id" required>
                <option value="">请选择仓库</option>
              </select>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="batch_no" class="form-label">批号 *</label>
              <input type="text" class="form-control" id="batch_no" name="batch_no" 
                     placeholder="请输入批号" required>
            </div>
            
            <div class="col-md-6 mb-3">
              <label for="quantity" class="form-label">库存数量 *</label>
              <input type="number" class="form-control" id="quantity" name="quantity" 
                     min="0" placeholder="请输入库存数量" required>
            </div>
          </div>
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="validity_date" class="form-label">有效期 *</label>
              <input type="date" class="form-control" id="validity_date" name="validity_date" required>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="d-flex justify-content-between">
          <button type="button" class="btn btn-secondary" onclick="history.back()">
            <i class="bi bi-arrow-left"></i> 返回
          </button>
          <div>
            <button type="reset" class="btn btn-outline-secondary me-2">
              <i class="bi bi-arrow-counterclockwise"></i> 重置
            </button>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-circle"></i> <span id="submitBtnText">保存</span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/inventory';
const urlParams = new URLSearchParams(window.location.search);
const inventoryId = urlParams.get('id');
const isEditMode = !!inventoryId;

// 页面初始化
document.addEventListener('DOMContentLoaded', async function() {
  // 设置页面标题
  if (isEditMode) {
    document.getElementById('formTitle').textContent = '编辑库存';
    document.getElementById('submitBtnText').textContent = '更新';
  }
  
  // 初始化下拉框数据
  await Promise.all([
    loadDrugs(),
    loadWarehouses()
  ]);
  
  // 如果是编辑模式，加载现有数据
  if (isEditMode) {
    await loadInventoryData();
  }
  
  // 设置最小有效期为今天
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('validity_date').min = today;
});

// 加载药品数据
async function loadDrugs() {
  try {
    const response = await fetch('/drug/list');
    const drugs = await response.json();
    const select = document.getElementById('drug_id');
    
    drugs.forEach(drug => {
      const option = document.createElement('option');
      option.value = drug.drug_id;
      option.textContent = `${drug.drug_id} - ${drug.generic_name}`;
      select.appendChild(option);
    });
  } catch (error) {
    console.error('加载药品数据失败:', error);
  }
}

// 加载仓库数据
async function loadWarehouses() {
  try {
    const response = await fetch('/warehouse/list');
    const warehouses = await response.json();
    const select = document.getElementById('warehouse_id');
    
    warehouses.forEach(warehouse => {
      const option = document.createElement('option');
      option.value = warehouse.warehouse_id;
      option.textContent = `${warehouse.warehouse_id} - ${warehouse.name}`;
      select.appendChild(option);
    });
  } catch (error) {
    console.error('加载仓库数据失败:', error);
  }
}

// 加载库存数据（编辑模式）
async function loadInventoryData() {
  try {
    const response = await fetch(`${apiBase}/${inventoryId}`);
    if (!response.ok) {
      throw new Error('库存数据不存在');
    }
    
    const inventory = await response.json();
    
    // 填充表单数据
    document.getElementById('inventory_id').value = inventory.inventory_id;
    document.getElementById('drug_id').value = inventory.drug_id;
    document.getElementById('warehouse_id').value = inventory.warehouse_id;
    document.getElementById('batch_no').value = inventory.batch_no;
    document.getElementById('quantity').value = inventory.quantity;
    document.getElementById('validity_date').value = inventory.validity_date;
    
  } catch (error) {
    console.error('加载库存数据失败:', error);
    alert('加载库存数据失败：' + error.message);
    history.back();
  }
}

// 表单提交处理
document.getElementById('inventoryForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  // 获取表单数据
  const formData = new FormData(this);
  const inventoryData = Object.fromEntries(formData.entries());
  
  // 数据验证
  if (!validateForm(inventoryData)) {
    return;
  }
  
  try {
    let response;
    
    if (isEditMode) {
      // 编辑模式 - PUT请求
      response = await fetch(`${apiBase}/${inventoryId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(inventoryData)
      });
    } else {
      // 新增模式 - POST请求
      response = await fetch(apiBase, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(inventoryData)
      });
    }
    
    if (response.ok) {
      const result = await response.json();
      alert(result.message || (isEditMode ? '库存更新成功！' : '库存添加成功！'));
      window.location.href = '/inventory';
    } else {
      const result = await response.json();
      alert('操作失败：' + (result.message || '未知错误'));
    }
  } catch (error) {
    console.error('提交失败:', error);
    alert('操作失败，请稍后重试');
  }
});

// 表单验证
function validateForm(data) {
  if (!data.drug_id) {
    alert('请选择药品');
    return false;
  }
  
  if (!data.warehouse_id) {
    alert('请选择仓库');
    return false;
  }
  
  if (!data.batch_no.trim()) {
    alert('请输入批号');
    return false;
  }
  
  if (!data.quantity || parseInt(data.quantity) < 0) {
    alert('请输入有效的库存数量');
    return false;
  }
  
  if (!data.validity_date) {
    alert('请选择有效期');
    return false;
  }
  
  // 检查有效期是否在过去
  const validityDate = new Date(data.validity_date);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  
  if (validityDate < today) {
    alert('有效期不能早于今天');
    return false;
  }
  
  return true;
}
</script>
</body>
</html>
