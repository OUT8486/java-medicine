<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session测试页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Session和用户名显示测试</h2>
        
        <div class="card mb-4">
            <div class="card-header">
                <h5>当前用户信息</h5>
            </div>
            <div class="card-body">
                <div th:if="${loggedInUser}">
                    <p><strong>登录用户：</strong> <span th:text="${loggedInUser}" class="text-success">用户名</span></p>
                    <p><strong>用户角色：</strong> <span th:text="${userRole}" class="text-primary">角色</span></p>
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle-fill"></i> 用户已登录
                    </div>
                </div>
                <div th:unless="${loggedInUser}">
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle-fill"></i> 用户未登录
                    </div>
                </div>
                
                <div class="mt-3">
                    <a href="/login" class="btn btn-primary">去登录</a>
                    <a href="/index" class="btn btn-secondary">返回首页</a>
                    <button id="testLogout" class="btn btn-danger">测试登出</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5>功能说明</h5>
            </div>
            <div class="card-body">
                <ul>
                    <li>登录后刷新此页面，应该能看到用户信息</li>
                    <li>点击"测试登出"按钮应该能清除session</li>
                    <li>登出后用户信息应该消失</li>
                    <li>首页右上角应该显示用户名和下拉菜单</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('testLogout').addEventListener('click', function() {
            if (confirm('确定要测试登出功能吗？')) {
                fetch('/logout', {
                    method: 'GET'
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('登出成功！页面将刷新。');
                        window.location.reload();
                    } else {
                        alert('登出失败：' + data.message);
                    }
                })
                .catch(error => {
                    console.error('登出错误:', error);
                    alert('登出失败，请稍后重试');
                });
            }
        });
    </script>
</body>
</html>
