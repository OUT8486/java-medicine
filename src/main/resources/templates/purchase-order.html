<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采购订单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><a class="navbar-brand" href="/index">药店管理系统</a></div></nav>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3"><h3>采购订单</h3><button class="btn btn-primary" onclick="openAddModal()"><i class="bi bi-plus"></i> 新增订单</button></div>
    <div class="card p-3 mb-3">
      <div class="row g-2">
        <div class="col-md-4"><input id="q_supplier_id" class="form-control" placeholder="供应商ID"></div>
        <div class="col-md-4"><input id="q_po_date" class="form-control" placeholder="采购日期"></div>
        <div class="col-md-4 d-flex gap-2"><button type="button" class="btn btn-outline-primary" onclick="loadList()">搜索</button><button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">重置</button></div>
      </div>
    </div>
    <div id="tableWrap"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const apiBase = '/purchase-order'; let currentEditId = null;
      async function loadList(){
        const wrap = document.getElementById('tableWrap'); wrap.innerHTML = '<div class="text-center">加载中...</div>';
        const terms = Array.from(document.querySelectorAll('[id^="q_"] , [id^="search"]')).map(i=> (i.value||'').toString().trim().toLowerCase()).filter(Boolean);
        try{
          const res = await fetch(apiBase + '/list');
          const d = await res.json();
          const items = Array.isArray(d)?d:(d.items||d.list||[]);
          const filtered = items.filter(it=>{ const s = JSON.stringify(it).toLowerCase(); return terms.every(t=> s.includes(t)); });
          displayItems(filtered);
        }catch(e){ console.error(e); wrap.innerHTML = '<div class="text-danger">加载失败</div>'; }
      }
    function displayItems(items){ const wrap=document.getElementById('tableWrap'); let html = `<table class="table table-striped"><thead><tr><th>订单ID</th><th>供应商ID</th><th>采购日期</th><th>经办人</th><th>审核状态</th><th>操作</th></tr></thead><tbody>`; for(const it of items){ html += `<tr><td>${it.po_id||''}</td><td>${it.supplier_id||''}</td><td>${it.po_date||''}</td><td>${it.employee_id||''}</td><td>${it.audit_status||''}</td><td><button class="btn btn-sm btn-secondary me-1" onclick="editItem('${it.po_id}')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteItem('${it.po_id}')">删除</button></td></tr>`;} html += `</tbody></table>`; wrap.innerHTML = html; }
    function clearSearch(){ document.getElementById('q_supplier_id').value=''; document.getElementById('q_po_date').value=''; loadList(); }
    function openAddModal(){ currentEditId=null; showModal('新增采购订单', {}); }
    function showModal(title, data){ const modalId='entityModal'; const inputs = `<div class="mb-2"><input id="f_po_id" class="form-control" placeholder="采购订单ID" value="${data.po_id||''}"></div><div class="mb-2"><input id="f_supplier_id" class="form-control" placeholder="供应商ID" value="${data.supplier_id||''}"></div><div class="mb-2"><input id="f_po_date" class="form-control" placeholder="采购日期" value="${data.po_date||''}"></div><div class="mb-2"><input id="f_employee_id" class="form-control" placeholder="经办人ID" value="${data.employee_id||''}"></div><div class="mb-2"><input id="f_audit_status" class="form-control" placeholder="审核状态（0/1）" value="${data.audit_status||''}"></div>`; const html = `<div class="modal" tabindex="-1" id="${modalId}"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">${title}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">${inputs}</div><div class="modal-footer"><button class="btn btn-primary" onclick="saveItem()">保存</button></div></div></div></div>`; document.body.insertAdjacentHTML('beforeend', html); const modal=new bootstrap.Modal(document.getElementById(modalId)); modal.show(); document.getElementById(modalId).addEventListener('hidden.bs.modal', ()=> document.getElementById(modalId).remove()); }
    async function saveItem(){ const payload={ po_id: document.getElementById('f_po_id').value, supplier_id: document.getElementById('f_supplier_id').value, po_date: document.getElementById('f_po_date').value, employee_id: document.getElementById('f_employee_id').value, audit_status: parseInt(document.getElementById('f_audit_status').value||0) }; const method=currentEditId?'PUT':'POST'; const url=currentEditId?`${apiBase}/${currentEditId}`:apiBase; await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); location.reload(); }
    async function editItem(id){ currentEditId=id; const res=await fetch(`${apiBase}/${id}`); const data=await res.json(); showModal('编辑采购订单', data); }
    async function deleteItem(id){ if(!confirm('确认删除?')) return; await fetch(`${apiBase}/${id}`,{method:'DELETE'}); loadList(); }
    window.onload=loadList;
  </script>
</body>
</html>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      fetch('/purchase-order/list')
        .then(r => r.json())
        .then(data => {
          const items = Array.isArray(data) ? data : (data.purchaseOrders || []);
          const tb = document.getElementById('purchaseOrderTableBody');

          if (!items || items.length === 0) {
            tb.innerHTML = '<tr><td colspan="6" class="text-center">暂无数据</td></tr>';
            return;
          }

          tb.innerHTML = items.map(o => `
            <tr>
              <td>${o.po_id || ''}</td>
              <td>${o.supplier_id || ''}</td>
              <td>${o.po_date || ''}</td>
              <td>${o.audit_status != null ? (o.audit_status==1? '已审核':'未审核') : ''}</td>
              <td>${o.employee_id || ''}</td>
              <td><button class="btn btn-sm btn-outline-primary">查看</button></td>
            </tr>
          `).join('');
        })
        .catch(e => {
          console.error(e);
          document.getElementById('purchaseOrderTableBody').innerHTML = '<tr><td colspan="6" class="text-center text-danger">加载失败</td></tr>';
        });
    });
  </script>
</body>
</html>
