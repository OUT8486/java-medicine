<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>药品表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      max-width: 800px
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid"><a class="navbar-brand" href="/index">药店管理系统</a></div>
  </nav>
  <div class="container mt-4">
    <h3 id="title">药品 - 新建</h3>
    <form id="form" class="card p-3">
      <div class="mb-3"><label class="form-label">药品ID</label><input id="drug_id" class="form-control"></div>
      <div class="mb-3"><label class="form-label">通用名</label><input id="generic_name" class="form-control" required>
      </div>
      <div class="mb-3"><label class="form-label">规格</label><input id="specification" class="form-control"></div>
      <div class="mb-3"><label class="form-label">零售价</label><input id="retail_price" class="form-control" type="number"
          step="0.01" required></div>
      <div class="mb-3"><label class="form-label">厂家ID</label><input id="manufacturer_id" class="form-control"></div>
      <div class="d-flex gap-2"><button class="btn btn-primary">保存</button><a class="btn btn-secondary"
          href="/drug">返回</a></div>
    </form>
  </div>
  <script>
    function qs(name) { const u = new URLSearchParams(location.search); return u.get(name); }
    const id = qs('id');
    if (id) { document.getElementById('title').textContent = '药品 - 编辑'; fetch(`/drug/${id}`).then(r => r.json()).then(d => { d = d || {}; document.getElementById('drug_id').value = d.drug_id || ''; document.getElementById('generic_name').value = d.generic_name || ''; document.getElementById('specification').value = d.specification || ''; document.getElementById('retail_price').value = d.retail_price || ''; document.getElementById('manufacturer_id').value = d.manufacturer_id || ''; }).catch(e => console.error(e)); }

    document.getElementById('form').addEventListener('submit', function (e) {
      e.preventDefault();
      const retailVal = document.getElementById('retail_price').value;
      if (!retailVal || Number(retailVal) <= 0) { alert('请填写有效的零售价 (>0)'); return; }
      const payload = {
        drug_id: document.getElementById('drug_id').value || undefined,
        generic_name: document.getElementById('generic_name').value,
        specification: document.getElementById('specification').value || undefined,
        retail_price: Number(retailVal),
        manufacturer_id: document.getElementById('manufacturer_id').value || undefined
      };
      const url = id ? `/drug/${id}` : '/drug';
      const method = id ? 'PUT' : 'POST';
      fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
        .then(async r => {
          const t = await r.json().catch(() => ({}));
          if (r.ok) { alert(t.message || '保存成功'); location.href = '/drug'; }
          else { alert(t.message || '保存失败'); }
        })
        .catch(e => { console.error(e); alert('保存失败'); });
    });

    // 查看厂家信息（如果需要）
    function loadManufacturerInfo() {
      if (!id) return;
      fetch(`/drug/${id}/with-manufacturer`)
        .then(r => { if (!r.ok) throw new Error('未找到'); return r.json(); })
        .then(d => { alert('厂家：' + (d.manufacturer_name || d.manufacturer_id)); })
        .catch(e => console.warn('厂家信息不可用'));
    }
    // 在编辑页加载厂家信息（非必须）
    if (id) setTimeout(loadManufacturerInfo, 300);
  </script>
</body>

</html>
