<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style> .search-row .col {padding-right:8px;} </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
  </div>
</nav>

<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>客户管理</h2>
    <button class="btn btn-primary" onclick="openAddModal()"><i class="bi bi-plus"></i> 新增客户</button>
  </div>

  <div class="card p-3 mb-4">
    <div class="row search-row g-2">
      <div class="col-md-4"><input id="q_name" class="form-control" placeholder="客户姓名"></div>
      <div class="col-md-4"><input id="q_type" class="form-control" placeholder="客户类型"></div>
      <div class="col-md-4 d-flex gap-2"><button type="button" class="btn btn-outline-primary" onclick="loadList()">搜索</button><button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">重置</button></div>
    </div>
  </div>

  <div id="tableWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/customer';
let currentEditId = null;

async function loadList(){
  const tbWrap = document.getElementById('tableWrap');
  tbWrap.innerHTML = '<div class="text-center">加载中...</div>';
  const terms = Array.from(document.querySelectorAll('[id^="q_"] , [id^="search"]')).map(i=> (i.value||'').toString().trim().toLowerCase()).filter(Boolean);
  try{
    const res = await fetch(apiBase + '/list');
    const d = await res.json();
    let items = Array.isArray(d)?d: (d.items||d.list||[]);
    const filtered = items.filter(it=>{ const s=JSON.stringify(it).toLowerCase(); return terms.every(t=> s.includes(t)); });
    displayItems(filtered);
  }catch(e){ console.error(e); tbWrap.innerHTML = '<div class="text-danger">加载失败</div>'; }
}

function displayItems(items){
  const wrap = document.getElementById('tableWrap');
  let html = `<table class="table table-striped"><thead><tr>`;
  html += `<th>客户ID</th><th>姓名</th><th>类型</th><th>联系电话</th><th>操作</th>`;
  html += `</tr></thead><tbody>`;
  for(const it of items){
    html += `<tr>`;
    html += `<td>${it.customer_id||''}</td>`;
    html += `<td>${it.name||''}</td>`;
    html += `<td>${it.type||''}</td>`;
    html += `<td>${it.contact_phone||''}</td>`;
    html += `<td><button class="btn btn-sm btn-secondary me-1" onclick="editItem('${it.customer_id}')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteItem('${it.customer_id}')">删除</button></td>`;
    html += `</tr>`;
  }
  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function clearSearch(){ document.getElementById('q_name').value=''; document.getElementById('q_type').value=''; loadList(); }

function openAddModal(){ currentEditId = null; showModal('新增客户', {}); }

function showModal(title, data){
  const modalId = 'entityModal';
  const inputs = `
    <div class="mb-2"><input id="f_customer_id" class="form-control" placeholder="客户ID" value="${data.customer_id||''}"></div>
    <div class="mb-2"><input id="f_name" class="form-control" placeholder="姓名" value="${data.name||''}"></div>
    <div class="mb-2"><input id="f_type" class="form-control" placeholder="类型" value="${data.type||''}"></div>
    <div class="mb-2"><input id="f_contact_phone" class="form-control" placeholder="联系电话" value="${data.contact_phone||''}"></div>
  `;
  const html = `
  <div class="modal" tabindex="-1" id="${modalId}">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">${title}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">${inputs}</div>
        <div class="modal-footer"><button class="btn btn-primary" onclick="saveItem()">保存</button></div>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  const modal = new bootstrap.Modal(document.getElementById(modalId));
  modal.show();
  document.getElementById(modalId).addEventListener('hidden.bs.modal', ()=> document.getElementById(modalId).remove());
}

async function saveItem(){
  const payload = {
    customer_id: document.getElementById('f_customer_id').value,
    name: document.getElementById('f_name').value,
    type: document.getElementById('f_type').value,
    contact_phone: document.getElementById('f_contact_phone').value
  };
  const method = currentEditId ? 'PUT' : 'POST';
  const url = currentEditId ? `${apiBase}/${currentEditId}` : apiBase;
  await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  location.reload();
}

async function editItem(id){
  currentEditId = id;
  const res = await fetch(`${apiBase}/${id}`);
  const data = await res.json();
  showModal('编辑客户', data);
}

async function deleteItem(id){
  if(!confirm('确认删除?')) return;
  await fetch(`${apiBase}/${id}`, {method:'DELETE'});
  loadList();
}

window.onload = loadList;
</script>
</body>
</html>
