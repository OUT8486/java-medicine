<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/index"><i class="bi bi-hospital"></i> 药店管理系统</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>药品管理</h2>
        <button class="btn btn-primary" onclick="openAddModal()"><i class="bi bi-plus"></i> 新增药品</button>
    </div>

    <div class="card p-3 mb-4">
        <div class="row g-2">
            <div class="col-md-4"><input id="q_name" class="form-control" placeholder="通用名"></div>
            <div class="col-md-4"><input id="q_manufacturer" class="form-control" placeholder="厂家ID"></div>
            <div class="col-md-4 d-flex gap-2"><button type="button" class="btn btn-outline-primary" onclick="loadList()">搜索</button><button type="button" class="btn btn-outline-secondary" onclick="clearSearch()">重置</button></div>
        </div>
    </div>

    <div id="tableWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const apiBase = '/drug';
let currentEditId = null;

async function loadList(){
    const wrap = document.getElementById('tableWrap'); wrap.innerHTML = '<div class="text-center">加载中...</div>';
    const nameTerm = (document.getElementById('q_name').value||'').toString().trim().toLowerCase();
    const manuTerm = (document.getElementById('q_manufacturer').value||'').toString().trim().toLowerCase();
    try{
        const res = await fetch(apiBase + '/list');
        const d = await res.json();
        const items = Array.isArray(d)?d:(d.items||d.list||[]);
        const filtered = items.filter(it=>{
            if(nameTerm){
                const s = (it.generic_name||'').toString().toLowerCase();
                if(!s.includes(nameTerm)) return false;
            }
            if(manuTerm){
                const mid = (it.manufacturer_id||'').toString().toLowerCase();
                if(mid !== manuTerm) return false;
            }
            return true;
        });
        displayItems(filtered);
    }catch(e){ console.error(e); wrap.innerHTML = '<div class="text-danger">加载失败</div>'; }
}

function displayItems(items){
    const wrap = document.getElementById('tableWrap');
    let html = `<table class="table table-striped"><thead><tr><th>ID</th><th>通用名</th><th>批准文号</th><th>剂型</th><th>规格</th><th>单位</th><th>采购价</th><th>零售价</th><th>厂家ID</th><th>操作</th></tr></thead><tbody>`;
    for(const it of items){
        html += `<tr><td>${it.drug_id||''}</td><td>${it.generic_name||''}</td><td>${it.approval_no||''}</td><td>${it.dosage_form||''}</td><td>${it.specification||''}</td><td>${it.unit||''}</td><td>${it.purchase_price||''}</td><td>${it.retail_price||''}</td><td>${it.manufacturer_id||''}</td><td><button class="btn btn-sm btn-secondary me-1" onclick="editItem('${it.drug_id}')">编辑</button><button class="btn btn-sm btn-danger" onclick="deleteItem('${it.drug_id}')">删除</button></td></tr>`;
    }
    html += `</tbody></table>`;
    wrap.innerHTML = html;
}

function clearSearch(){ document.getElementById('q_name').value=''; document.getElementById('q_manufacturer').value=''; loadList(); }

function openAddModal(){ currentEditId = null; showModal('新增药品', {}); }

function showModal(title, data){
    const modalId = 'entityModal';
    const inputs = `
        <div class="mb-2"><input id="f_drug_id" class="form-control" placeholder="药品ID" value="${data.drug_id||''}"></div>
        <div class="mb-2"><input id="f_generic_name" class="form-control" placeholder="通用名" value="${data.generic_name||''}"></div>
        <div class="mb-2"><input id="f_approval_no" class="form-control" placeholder="批准文号" value="${data.approval_no||''}"></div>
        <div class="mb-2"><input id="f_dosage_form" class="form-control" placeholder="剂型" value="${data.dosage_form||''}"></div>
        <div class="mb-2"><input id="f_specification" class="form-control" placeholder="规格" value="${data.specification||''}"></div>
        <div class="mb-2"><input id="f_unit" class="form-control" placeholder="单位" value="${data.unit||''}"></div>
        <div class="mb-2"><input id="f_purchase_price" class="form-control" placeholder="采购价" value="${data.purchase_price||''}"></div>
        <div class="mb-2"><input id="f_retail_price" class="form-control" placeholder="零售价" value="${data.retail_price||''}"></div>
        <div class="mb-2"><input id="f_manufacturer_id" class="form-control" placeholder="厂家ID" value="${data.manufacturer_id||''}"></div>
    `;
    const html = `
    <div class="modal" tabindex="-1" id="${modalId}">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">${title}</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">${inputs}</div>
                <div class="modal-footer"><button class="btn btn-primary" onclick="saveItem()">保存</button></div>
            </div>
        </div>
    </div>`;
    document.body.insertAdjacentHTML('beforeend', html);
    const modal = new bootstrap.Modal(document.getElementById(modalId));
    modal.show();
    document.getElementById(modalId).addEventListener('hidden.bs.modal', ()=> document.getElementById(modalId).remove());
}

async function saveItem(){
    const payload = {
        drug_id: document.getElementById('f_drug_id').value,
        generic_name: document.getElementById('f_generic_name').value,
        approval_no: document.getElementById('f_approval_no').value,
        dosage_form: document.getElementById('f_dosage_form').value,
        specification: document.getElementById('f_specification').value,
        unit: document.getElementById('f_unit').value,
        purchase_price: document.getElementById('f_purchase_price').value,
        retail_price: document.getElementById('f_retail_price').value,
        manufacturer_id: document.getElementById('f_manufacturer_id').value
    };
    const method = currentEditId ? 'PUT' : 'POST';
    const url = currentEditId ? `${apiBase}/${currentEditId}` : apiBase;
    await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    location.reload();
}

async function editItem(id){ currentEditId = id; const res = await fetch(`${apiBase}/${id}`); const data = await res.json(); showModal('编辑药品', data); }

async function deleteItem(id){ if(!confirm('确认删除?')) return; await fetch(`${apiBase}/${id}`, {method:'DELETE'}); loadList(); }

window.onload = loadList;
</script>
</body>
</html>
