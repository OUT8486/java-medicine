# 服务器端口（可选，默认8080）
server:
  port: 8080
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

# 数据库连接配置
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 关键修改：补充 utf8mb4 + characterSetResults + allowPublicKeyRetrieval
    url: jdbc:mysql://localhost:3306/medicine?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root  # 你的MySQL用户名
    password: 123456  # 你的MySQL密码
  # Thymeleaf模板引擎配置
  thymeleaf:
    cache: false  # 开发环境关闭缓存，便于调试
    prefix: classpath:/templates/  # 模板文件路径
    suffix: .html  # 模板文件后缀
    mode: HTML  # 模板模式
    encoding: UTF-8  # 编码格式
    servlet:
      content-type: text/html  # 内容类型
  
  # Jackson配置：驼峰属性转下划线JSON字段（适配前端下划线命名）
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null  # 忽略空值字段

# MyBatis配置
mybatis:
  # 如果你用注解写SQL，可注释掉这行；如果用XML，保留
  mapper-locations: classpath:mapper/*.xml
  # 关键修改：包名改为你的实际包名 com.example.spring_boot.entity
  type-aliases-package: com.example.spring_boot.entity
  configuration:
    map-underscore-to-camel-case: true  # 数据库下划线→实体类驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志