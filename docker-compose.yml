services:

  mysql:
    image: mysql:8.0
    container_name: medicine-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: medicine
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p123456"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: medicine-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "123456"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "123456",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medicine-backend

    environment:
      SERVER_PORT: 8080

      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/medicine?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: 123456

      JWT_SECRET: medicine-docker-local-secret-2026-1234567890

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8080/health"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  frontend:
    build:
      context: ./vue-medicine
      dockerfile: Dockerfile

    container_name: medicine-frontend

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:80"

    restart: unless-stopped


volumes:
  mysql-data:
  redis-data: