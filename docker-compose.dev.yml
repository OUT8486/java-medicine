version: "3.9"

services:
  # 开发模式：后端使用 maven 镜像运行 spring-boot:run，挂载源码实现热重载（需在项目中添加 devtools 更好）
  backend:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: medicine-backend-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ~/.m2:/root/.m2
    command: mvn -Dspring-boot.run.fork=false spring-boot:run
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicine?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: 123456
    depends_on:
      - mysql
      - redis

  # 前端开发：使用 Vite dev server，挂载源码并映射 5173 端口
  frontend:
    image: node:20-alpine
    container_name: medicine-frontend-dev
    working_dir: /app
    volumes:
      - ./vue-medicine:/app
      - /app/node_modules
    command: sh -c "npm ci --silent && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
